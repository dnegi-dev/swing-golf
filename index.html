<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<title>Swing Golf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Golf-Scorecard fuer 18 Bahnen. Laeuft offline, speichert alles lokal auf dem Geraet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swing Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f7a4a">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='38' fill='%230b4a32'/><circle cx='58' cy='130' r='20' fill='%23f6f8f6'/><path d='M112 32v116' stroke='%23f6f8f6' stroke-width='10' stroke-linecap='round'/><path d='M112 38l46 19-46 19z' fill='%23e04141'/></svg>">
<style>
/* =========================================================================
   Farben und Masse. Hell ist die Grundlage, Dunkel haengt an data-theme;
   "auto" laesst die Media Query entscheiden.
   ========================================================================= */
:root{
  --bg:#f6f7f4;          /* leicht warmes Off-White statt kaltem Grau */
  --surface:#ffffff;
  --sunken:#eef0ea;
  --quiet:#f2f4ef;
  --text:#1b241f;
  --muted:#6b7870;
  --line:#e3e7e0;        /* nur noch dort, wo eine Kante wirklich noetig ist */
  --accent:#2f7d54;
  --accent-soft:#e6f1ea;
  --accent-press:#256544;
  --on-accent:#ffffff;
  --danger:#b3392f;
  --ace:#8a3fb0; --eagle:#8a3fb0; --birdie:#c2453a; --par:#4a5a52;
  --bogey:#2f6aa8; --double:#1d4470;
  --r:16px;              /* Standardradius */
  --r-lg:22px;
  --shadow:0 1px 2px rgba(20,35,27,.05), 0 6px 18px rgba(20,35,27,.05);
  --gap:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1a211d; --sunken:#151b18; --quiet:#212a25;
    --text:#e9efea; --muted:#9aa9a0; --line:#2a342e;
    --accent:#4eb37c; --accent-soft:#1d3228; --accent-press:#3d9668; --on-accent:#07140d;
    --danger:#f0867c;
    --ace:#d79cf0; --eagle:#d79cf0; --birdie:#ff9188; --par:#b3c2b9;
    --bogey:#7fb4ef; --double:#a8caf3;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --sunken:#151b18; --quiet:#212a25;
  --text:#e9efea; --muted:#9aa9a0; --line:#2a342e;
  --accent:#4eb37c; --accent-soft:#1d3228; --accent-press:#3d9668; --on-accent:#07140d;
  --danger:#f0867c;
  --ace:#d79cf0; --eagle:#d79cf0; --birdie:#ff9188; --par:#b3c2b9;
  --bogey:#7fb4ef; --double:#a8caf3;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0}

/* ---------- Bedienelemente ---------- */
button, input, select{font:inherit; color:inherit}
button{
  -webkit-appearance:none; appearance:none; border:none;
  background:var(--surface); color:var(--text);
  border-radius:var(--r); padding:13px 16px; min-height:48px;
  cursor:pointer; touch-action:manipulation; font-weight:520;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  transition:background-color .12s ease, transform .06s ease;
}
button:active{transform:scale(.985)}
button:disabled{opacity:.4; cursor:default}
button:focus-visible, input:focus-visible, select:focus-visible{
  outline:3px solid var(--accent); outline-offset:2px
}
.btn-primary{background:var(--accent); color:var(--on-accent); font-weight:640; box-shadow:var(--shadow)}
.btn-primary:active{background:var(--accent-press)}
.btn-soft{background:var(--quiet)}
.btn-quiet{background:transparent; color:var(--muted); font-weight:500}
.btn-danger{background:transparent; color:var(--danger)}
.btn-wide{width:100%}

input[type=text], input[type=date], input[type=number]{
  background:var(--quiet); border:1px solid transparent; border-radius:var(--r);
  padding:13px 14px; min-height:48px; width:100%; font-size:16px;
}
input:focus{border-color:var(--accent); background:var(--surface)}
select{
  background:var(--quiet); border:1px solid transparent; border-radius:12px;
  padding:9px 8px; min-height:44px; color:var(--text);
}

/* ---------- Geruest ---------- */
#app{max-width:680px; margin:0 auto}
.screen{
  display:flex; flex-direction:column; min-height:100dvh;
  padding:0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
}
.screen.tabbed{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.screen.plain{padding-bottom:calc(24px + env(safe-area-inset-bottom))}

.topbar{display:flex; align-items:center; gap:12px; min-height:60px;
  padding-top:max(14px, env(safe-area-inset-top))}
.topbar h1{font-size:22px; letter-spacing:-.2px; flex:1; min-width:0}
.topbar .sub{display:block; font-size:13px; color:var(--muted); font-weight:400; letter-spacing:0}
.topbar button{min-height:42px; padding:8px 14px; font-size:15px; background:transparent; color:var(--accent)}

/* ---------- Untere Navigation ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  display:flex; justify-content:center; gap:2px;
  padding:6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.tabbar .inner{display:flex; width:100%; max-width:680px}
.tabbar button{
  flex:1; background:transparent; border-radius:12px; padding:6px 2px 4px; min-height:56px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:11px; font-weight:560; color:var(--muted); letter-spacing:.1px;
}
.tabbar button .ic{font-size:20px; line-height:1; display:block}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* ---------- Flaechen ---------- */
.card{background:var(--surface); border-radius:var(--r-lg); padding:16px; margin-bottom:var(--gap);
  box-shadow:var(--shadow)}
.card.flat{background:transparent; box-shadow:none; padding:0}
.sect{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.2px; margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex; flex-direction:column; gap:10px}
.row{display:flex; align-items:center; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.grow{flex:1; min-width:0}
.truncate{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.empty{text-align:center; color:var(--muted); padding:34px 12px; line-height:1.6}
.empty .big{display:block; margin-bottom:10px; opacity:.45}
.empty .big svg{width:34px; height:34px; stroke-width:1.6}
.hint{font-size:13px; color:var(--muted); margin:10px 2px 0; line-height:1.5}

/* ---------- Startseite ---------- */
.hero{background:var(--surface); border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow);
  margin-bottom:var(--gap)}
.hero .eyebrow{font-size:13px; color:var(--muted)}
.hero .title{font-size:24px; font-weight:680; letter-spacing:-.3px; margin:2px 0 2px}
.hero .meta{font-size:14px; color:var(--muted); margin-bottom:16px}
.hero .lead{display:flex; align-items:baseline; gap:8px; margin:0 0 16px}
.hero .lead .n{font-size:34px; font-weight:740; font-variant-numeric:tabular-nums; line-height:1}
.progress{height:6px; border-radius:999px; background:var(--sunken); overflow:hidden; margin:0 0 16px}
.progress span{display:block; height:100%; background:var(--accent); border-radius:999px}

/* ---------- Rundenliste ---------- */
.round-item{width:100%; text-align:left; display:flex; align-items:center; gap:12px;
  padding:14px; background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow)}
.round-item .meta{flex:1; min-width:0}
.round-item .title{font-weight:620; display:block}
.round-item .score{font-variant-numeric:tabular-nums; font-weight:700; font-size:17px}
.badge{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.3px;
  padding:4px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent)}

/* ---------- Vorlagen, Chips, Schalter ---------- */
.chips-row{display:flex; flex-wrap:wrap; gap:8px}
.chip-btn{font-size:14px; padding:9px 14px; min-height:40px; border-radius:999px; background:var(--quiet)}
.chip-btn.on{background:var(--accent); color:var(--on-accent); font-weight:640}
.preset{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:14px; background:var(--quiet); border-radius:var(--r)}
.preset .title{font-weight:620; display:block}
.preset.on{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent)}
.preset .tick{flex:0 0 auto; color:var(--accent); font-weight:800; font-size:18px}
.tag{font-size:11px; font-weight:640; padding:3px 8px; border-radius:999px;
  background:var(--sunken); color:var(--muted); margin-left:8px}
.switch{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px}
.switch .box{flex:0 0 26px; height:26px; border:2px solid var(--line); border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px}
.switch[aria-pressed="true"] .box{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.switch .lbl{flex:1; min-width:0}
.switch .lbl b{display:block; font-weight:620}
.switch .lbl span{display:block; font-size:13px; color:var(--muted)}

/* Segment-Auswahl (Darstellung) */
.segment{display:flex; gap:4px; background:var(--quiet); border-radius:14px; padding:4px}
.segment button{flex:1; min-height:42px; border-radius:11px; background:transparent; font-size:15px}
.segment button[aria-pressed="true"]{background:var(--surface); font-weight:640; box-shadow:var(--shadow)}

/* Listeneintrag mit Pfeil (Einstellungen) */
.link-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:14px 16px; background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow)}
.link-row .ic{flex:0 0 24px; color:var(--muted); display:flex; align-items:center; justify-content:center}
.link-row .t{flex:1; min-width:0}
.link-row .t b{display:block; font-weight:600}
.link-row .t span{display:block; font-size:13px; color:var(--muted)}
.link-row .arrow{color:var(--muted)}

/* ---------- Setup: Par und Stroke-Index ---------- */
.par-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:7px}
@media (min-width:480px){ .par-grid{grid-template-columns:repeat(9, 1fr)} }
.par-cell{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0;
  min-height:54px; background:var(--quiet); border-radius:12px}
.par-cell .hole{font-size:11px; color:var(--muted); line-height:1}
.par-cell .val{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
.si-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px}
@media (min-width:480px){ .si-grid{grid-template-columns:repeat(6, 1fr)} }
.si-cell{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.si-cell select{flex:1; min-width:0}

/* ---------- Bahn-Eingabe ---------- */
.hole-head{text-align:center; padding:4px 0 18px}
.hole-head .no{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.hole-head .par{font-size:42px; font-weight:740; line-height:1.15; font-variant-numeric:tabular-nums;
  letter-spacing:-.5px}
.player-card{background:var(--surface); border-radius:var(--r-lg); padding:14px 14px 16px;
  margin-bottom:11px; box-shadow:var(--shadow)}
.player-card .name{font-weight:620; display:flex; align-items:baseline; gap:8px}
.player-card .running{margin-left:auto; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.stepper{display:flex; align-items:center; gap:10px; margin-top:10px}
.stepper .step{flex:0 0 66px; height:60px; font-size:26px; font-weight:600; background:var(--quiet);
  display:flex; align-items:center; justify-content:center}
.stepper .value{flex:1; text-align:center; min-width:0}
.stepper .value .n{font-size:34px; font-weight:740; line-height:1.05; font-variant-numeric:tabular-nums; display:block}
.stepper .value .lbl{font-size:12px; letter-spacing:.05em; text-transform:uppercase; display:block; min-height:15px}
.stepper .clear{flex:0 0 44px; height:44px; padding:0; font-size:17px; align-self:center;
  background:transparent; color:var(--muted)}
.s-ace{color:var(--ace)} .s-eagle{color:var(--eagle)} .s-birdie{color:var(--birdie)}
.s-par{color:var(--par)} .s-bogey{color:var(--bogey)} .s-double{color:var(--double)}
.s-none{color:var(--muted)}

.navbar{position:sticky; bottom:0; margin-top:auto; display:flex; gap:10px; align-items:center;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 74%, transparent)}
.navbar button{flex:1}
.navbar .pos{flex:0 0 auto; font-variant-numeric:tabular-nums; font-weight:640; color:var(--muted);
  font-size:14px; padding:0 4px}

/* ---------- Scorekarte ---------- */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--r);
  background:var(--surface); box-shadow:var(--shadow)}
table.card-table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
table.card-table th, table.card-table td{padding:8px 4px; text-align:center; font-size:14px;
  border-bottom:1px solid var(--line); min-width:31px}
table.card-table tbody tr:last-child th, table.card-table tbody tr:last-child td{border-bottom:none}
table.card-table thead th{font-size:11px; color:var(--muted); font-weight:600; position:sticky; top:0;
  background:var(--surface)}
table.card-table th.name-col, table.card-table td.name-col{
  text-align:left; position:sticky; left:0; background:var(--surface); z-index:1;
  min-width:78px; max-width:108px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding-left:12px; font-weight:600}
table.card-table tr.par-row td, table.card-table tr.par-row th{background:var(--sunken); color:var(--muted); font-size:13px}
table.card-table td.sum{font-weight:700; background:var(--quiet)}
table.card-table tr.par-row td.sum{background:var(--sunken)}
table.card-table td.empty-cell{color:var(--line)}
.par-editable{cursor:pointer}

/* ---------- Ergebnis ---------- */
.rank{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:none}
.rank .pos{flex:0 0 30px; font-size:19px; font-weight:740; text-align:center; color:var(--muted);
  font-variant-numeric:tabular-nums}
.rank.win .pos{color:var(--accent)}
.rank .who{flex:1; min-width:0}
.rank .who .n{display:block; font-weight:620}
.rank .who .small{display:block}
.rank .tot{text-align:right; font-variant-numeric:tabular-nums}
.rank .tot .strokes{font-size:22px; font-weight:740; display:block; line-height:1.1}
.rank .tot .rel{font-size:13px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
.chip{font-size:12px; padding:3px 9px; border-radius:999px; background:var(--quiet)}

/* ---------- Statistik ---------- */
.stat-name{font-size:17px; font-weight:640; color:var(--text)}
.stat-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:9px; margin:12px 0}
.stat{background:var(--quiet); border-radius:14px; padding:12px 14px}
.stat .v{font-size:22px; font-weight:740; font-variant-numeric:tabular-nums; line-height:1.15}
.stat .k{font-size:12px; color:var(--muted); margin-top:2px}
.bars{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.bar{display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:9px; font-size:13px}
.bar .track{height:9px; background:var(--sunken); border-radius:999px; overflow:hidden}
.bar .fill{height:100%; border-radius:999px; background:var(--accent)}
.bar .n{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}

/* ---------- Impressum ---------- */
.legal{font-size:15px; line-height:1.6}
.legal h3{font-size:13px; font-weight:600; color:var(--muted); margin:18px 0 4px}
.legal h3:first-child{margin-top:0}
.legal p{margin:0 0 4px}
.todo{background:color-mix(in srgb, var(--danger) 12%, transparent);
  border:1px dashed var(--danger); border-radius:7px; padding:1px 7px; font-weight:620}

.notice{background:var(--quiet); border-left:4px solid var(--danger);
  border-radius:10px; padding:12px 14px; margin-bottom:var(--gap); font-size:14px}

/* ---------- Selbsttest ---------- */
.test{padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px; display:flex; gap:10px}
.test .mark{flex:0 0 20px; font-weight:700}
.test.pass .mark{color:var(--accent)} .test.fail .mark{color:var(--danger)}
.test.fail{background:color-mix(in srgb, var(--danger) 10%, transparent)}
.test code{font-size:12px; color:var(--muted); display:block; word-break:break-word}

/* =========================================================================
   Druckansicht: nur die Karte, schwarz auf weiss, ohne Bedienelemente.
   ========================================================================= */
.print-head{display:none}
@media print{
  @page{ margin:14mm; }
  :root, :root[data-theme="dark"]{
    --bg:#fff; --surface:#fff; --sunken:#fff; --quiet:#fff;
    --text:#000; --muted:#444; --line:#999; --shadow:none;
    --ace:#000; --eagle:#000; --birdie:#000; --par:#000; --bogey:#000; --double:#000;
  }
  body{background:#fff}
  .tabbar, .navbar, .topbar, .hint, .notice, button{display:none !important}
  #app{max-width:none}
  .screen{min-height:0; padding:0; display:block}
  .card, .table-wrap{box-shadow:none; padding:0; margin:0 0 8mm; border-radius:0}

  .print-head{display:block; margin:0 0 6mm}
  .print-head .t{font-size:18pt; font-weight:700}
  .print-head .m{font-size:10pt; color:#444; margin-top:2mm}

  .table-wrap{overflow:visible}
  table.card-table{width:100%; font-size:10pt; page-break-inside:avoid}
  table.card-table th, table.card-table td{border:1px solid #999; padding:2mm 1mm; min-width:0}
  table.card-table th.name-col, table.card-table td.name-col{position:static; max-width:none}
  table.card-table td.sum, table.card-table tr.par-row td, table.card-table tr.par-row th{
    background:#f0f0f0 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  /* Leere Bahnen bleiben leer zum Eintragen von Hand */
  table.card-table td.empty-cell{color:#fff}
  .rank{border-bottom:1px solid #999; page-break-inside:avoid}
  .chips{display:none}
}
</style>

<body>
<div id="app"></div>
<script type="module">
"use strict";

/* =========================================================================
   Modell und reine Rechenfunktionen
   -------------------------------------------------------------------------
   Alles hier ist frei von DOM und localStorage, damit der Selbsttest
   (?selftest=1) es direkt pruefen kann.
   ========================================================================= */

const DEFAULT_HOLES = 18;
const MIN_HOLES = 1;
const MAX_HOLES = 36;
const MIN_STROKES = 1;
const MAX_STROKES = 20;
const MIN_PAR = 3;
const MAX_PAR = 6;
const MAX_PLAYERS = 6;
const MAX_HCP = 54;
// Muster einer 18-Loch-Runde, Summe 72. Fuer andere Bahnenzahlen wird es
// zyklisch fortgesetzt -- irgendeine Vorlage braucht es, und diese ist die
// vertrauteste.
const PAR_PATTERN = [4,4,3,5,4,4,3,4,5, 4,3,4,5,4,4,3,4,5];

function defaultPars(holes){
  return Array.from({ length: holes }, (_, i) => PAR_PATTERN[i % PAR_PATTERN.length]);
}

// Stroke-Index: welche Bahn den wievielten Vorschlag bekommt. Ohne die Angaben
// der Scorekarte ist die Reihenfolge der Bahnen die einzige ehrliche Vorgabe.
function defaultSi(holes){
  return Array.from({ length: holes }, (_, i) => i + 1);
}

/* Die Bahnenzahl steht nicht im Modell, sie ist die Laenge von pars. Ein
   zweites Feld koennte davon abweichen, diese Ableitung nicht. */
function holeCount(round){
  return round.pars.length;
}

/* Out/In nur, wenn sich die Runde sauber halbieren laesst: bei 18 die
   ueblichen 9+9, bei 12 sechs und sechs. Bei 9 Bahnen gibt es keine
   sinnvolle Haelfte -- dann steht nur die Gesamtsumme. 0 heisst "nicht
   teilen". */
function halfPoint(holes){
  return (holes >= 6 && holes % 2 === 0) ? holes / 2 : 0;
}

/* Bringt einen Stroke-Index auf n Bahnen: vorhandene gueltige Werte bleiben
   an ihrer Bahn, alles andere wird mit den fehlenden Zahlen aufgefuellt.
   Ergebnis ist immer eine Permutation von 1..n. */
function resizeSi(si, n){
  const out = new Array(n);
  const used = new Set();
  for (let i = 0; i < n; i++){
    const v = Math.round(Number((si || [])[i]));
    if (v >= 1 && v <= n && !used.has(v)){ out[i] = v; used.add(v); }
  }
  const free = [];
  for (let v = 1; v <= n; v++) if (!used.has(v)) free.push(v);
  for (let i = 0; i < n; i++) if (out[i] == null) out[i] = free.shift();
  return out;
}

/* Das haeufigste Par der bisherigen Bahnen sagt mehr als eine allgemeine
   Vorlage: wer auf einem Platz mit zwoelfmal Par 3 eine Bahn ergaenzt, will
   dort keine Par 5. Gleichstand entscheidet das kleinere Par. */
function commonPar(pars){
  if (!pars.length) return PAR_PATTERN[0];
  const count = new Map();
  for (const v of pars) count.set(v, (count.get(v) || 0) + 1);
  let best = null, bestN = 0;
  for (const [v, n] of count){
    if (n > bestN || (n === bestN && v < best)){ best = v; bestN = n; }
  }
  return best;
}

/* Bahnenzahl einer noch nicht gestarteten Runde aendern. Bereits gesetzte
   Bahnen behalten ihr Par, neue bekommen das haeufigste Par der Runde. */
function resizeDraft(draft, holes){
  const raw = Math.round(Number(holes));
  const n = clamp(Number.isFinite(raw) ? raw : DEFAULT_HOLES, MIN_HOLES, MAX_HOLES);
  const fuellwert = commonPar(draft.pars);
  draft.pars = Array.from({ length: n }, (_, i) =>
    draft.pars[i] != null ? draft.pars[i] : fuellwert);
  draft.si = resizeSi(draft.si, n);
  return draft;
}

function uid(){
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function makePlayer(name, hcp){
  return { id: uid(), name: name || "", hcp: clamp(Math.round(hcp || 0), 0, MAX_HCP) };
}

function makeRound(courseName, date, players, pars, opts){
  const o = opts || {};
  const round = {
    id: uid(),
    courseName: courseName || "",
    date: date || todayISO(),
    pars: (pars && pars.length ? pars : defaultPars(DEFAULT_HOLES)).slice(0, MAX_HOLES),
    si: [],
    stableford: !!o.stableford,
    players: players.map(p => ({
      id: p.id || uid(),
      name: p.name,
      hcp: clamp(Math.round(p.hcp || 0), 0, MAX_HCP)
    })),
    strokes: {},
    completedAt: null
  };
  round.si = resizeSi(o.si, round.pars.length);
  for (const p of round.players) round.strokes[p.id] = new Array(round.pars.length).fill(null);
  return round;
}

/* Gleicht eine geladene Runde an das erwartete Format an: fehlende Bahnen
   auffuellen, zu lange Arrays kappen, Muell zu null machen. Laeuft ueber
   alles, was aus dem localStorage kommt -- da steht potentiell eine aeltere
   Version der App drin. */
function normalizeRound(raw){
  if (!raw || typeof raw !== "object") return null;

  /* Die Bahnenzahl kommt aus den gespeicherten Daten, nicht aus einer
     Konstanten -- sonst wuerde eine 9-Loch-Runde beim Laden auf 18
     aufgeblasen. */
  const rawPars = Array.isArray(raw.pars) ? raw.pars : [];
  const holes = clamp(rawPars.length || DEFAULT_HOLES, MIN_HOLES, MAX_HOLES);
  const fallback = defaultPars(holes);

  const pars = new Array(holes);
  for (let i = 0; i < holes; i++){
    const v = Number(rawPars[i]);
    pars[i] = Number.isFinite(v) && v > 0 ? clamp(Math.round(v), MIN_PAR, MAX_PAR) : fallback[i];
  }

  /* Stroke-Index: jede Zahl 1..18 genau einmal. Alles andere (fehlend, doppelt,
     Unsinn) faellt auf die Vorgabe zurueck -- ein halb kaputter Index verteilt
     Vorschlaege falsch, und das faellt niemandem auf. */
  let si = Array.isArray(raw.si) ? raw.si.map(v => Math.round(Number(v))) : [];
  const seen = new Set(si);
  if (si.length !== holes || seen.size !== holes || si.some(v => !(v >= 1 && v <= holes))){
    si = defaultSi(holes);
  }

  const players = Array.isArray(raw.players)
    ? raw.players.filter(p => p && p.id).map(p => ({
        id: String(p.id),
        name: String(p.name || ""),
        hcp: Number.isFinite(Number(p.hcp)) ? clamp(Math.round(Number(p.hcp)), 0, MAX_HCP) : 0
      }))
    : [];
  if (!players.length) return null;

  const strokes = {};
  for (const p of players){
    const src = raw.strokes && Array.isArray(raw.strokes[p.id]) ? raw.strokes[p.id] : [];
    const out = new Array(holes);
    for (let i = 0; i < holes; i++){
      const v = Number(src[i]);
      out[i] = Number.isFinite(v) && v > 0 ? clamp(Math.round(v), MIN_STROKES, MAX_STROKES) : null;
    }
    strokes[p.id] = out;
  }

  return {
    id: String(raw.id || uid()),
    courseName: String(raw.courseName || ""),
    date: String(raw.date || todayISO()),
    pars, si,
    stableford: !!raw.stableford,
    players, strokes,
    completedAt: raw.completedAt ? String(raw.completedAt) : null
  };
}

function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }

/* Erster Tipp auf "+" setzt direkt auf Par -- das ist der haeufigste Wert
   und spart auf der Bahn drei bis vier Tipper. */
function bumpStroke(current, par, delta){
  if (current == null) return clamp(delta > 0 ? par : par - 1, MIN_STROKES, MAX_STROKES);
  return clamp(current + delta, MIN_STROKES, MAX_STROKES);
}

function holesPlayed(round, playerId){
  return (round.strokes[playerId] || []).filter(v => v != null).length;
}

function totalStrokes(round, playerId, from = 0, to = holeCount(round)){
  let sum = 0;
  const s = round.strokes[playerId] || [];
  for (let i = from; i < to; i++) if (s[i] != null) sum += s[i];
  return sum;
}

/* Par nur der tatsaechlich gespielten Bahnen -- sonst steht man nach Bahn 1
   mit -68 da. */
function playedPar(round, playerId, from = 0, to = holeCount(round)){
  let sum = 0;
  const s = round.strokes[playerId] || [];
  for (let i = from; i < to; i++) if (s[i] != null) sum += round.pars[i];
  return sum;
}

function toPar(round, playerId, from = 0, to = holeCount(round)){
  return totalStrokes(round, playerId, from, to) - playedPar(round, playerId, from, to);
}

function scoreLabel(strokes, par){
  if (strokes == null) return { key: "none", label: "", cls: "s-none" };
  if (strokes === 1) return { key: "ace", label: "Hole-in-One", cls: "s-ace" };
  const d = strokes - par;
  if (d <= -3) return { key: "eagle", label: "Albatros", cls: "s-eagle" };
  if (d === -2) return { key: "eagle", label: "Eagle", cls: "s-eagle" };
  if (d === -1) return { key: "birdie", label: "Birdie", cls: "s-birdie" };
  if (d === 0)  return { key: "par", label: "Par", cls: "s-par" };
  if (d === 1)  return { key: "bogey", label: "Bogey", cls: "s-bogey" };
  if (d === 2)  return { key: "double", label: "Doppelbogey", cls: "s-double" };
  return { key: "double", label: "+" + d, cls: "s-double" };
}

function scoreCounts(round, playerId){
  const counts = { ace: 0, eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };
  const s = round.strokes[playerId] || [];
  for (let i = 0; i < holeCount(round); i++){
    if (s[i] == null) continue;
    counts[scoreLabel(s[i], round.pars[i]).key]++;
  }
  return counts;
}

/* Vorschlaege nach Spielvorgabe: erst jede Bahn einmal, der Rest nach
   Stroke-Index. Bei Vorgabe 0 kommt 0 heraus, dann ist Stableford brutto. */
function strokesReceived(hcp, si, holeIdx){
  const holes = si.length;
  const h = clamp(Math.round(hcp || 0), 0, MAX_HCP);
  return Math.floor(h / holes) + (si[holeIdx] <= (h % holes) ? 1 : 0);
}

function stablefordPoints(strokes, par, received){
  if (strokes == null) return null;
  return Math.max(0, 2 - ((strokes - received) - par));
}

function holePoints(round, playerId, i){
  const player = round.players.find(p => p.id === playerId);
  if (!player) return null;
  return stablefordPoints(
    round.strokes[playerId][i], round.pars[i],
    strokesReceived(player.hcp, round.si, i)
  );
}

function totalPoints(round, playerId, from = 0, to = holeCount(round)){
  let sum = 0;
  for (let i = from; i < to; i++){
    const p = holePoints(round, playerId, i);
    if (p != null) sum += p;
  }
  return sum;
}

function leaderboard(round){
  return round.players
    .map(p => ({
      id: p.id,
      name: p.name,
      hcp: p.hcp,
      strokes: totalStrokes(round, p.id),
      toPar: toPar(round, p.id),
      points: totalPoints(round, p.id),
      played: holesPlayed(round, p.id)
    }))
    .sort((a, b) =>
      (round.stableford ? b.points - a.points : a.toPar - b.toPar) ||
      a.strokes - b.strokes ||
      b.played - a.played ||
      a.name.localeCompare(b.name, "de")
    );
}

function roundProgress(round){
  return Math.max(0, ...round.players.map(p => holesPlayed(round, p.id)));
}

function isRoundEmpty(round){
  return roundProgress(round) === 0;
}

function fmtToPar(n){
  if (n === 0) return "E";
  return (n > 0 ? "+" : "-") + Math.abs(n);
}

function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? m[3] + "." + m[2] + "." + m[1] : (iso || "");
}

/* =========================================================================
   Statistik, Vorschlaege, Teilen, Export
   ========================================================================= */

const EMPTY_COUNTS = { ace: 0, eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };

/* Fasst ueber alle abgeschlossenen Runden zusammen, gebuendelt nach
   Spielernamen -- Spieler-IDs sind pro Runde neu, der Name ist die einzige
   Klammer ueber mehrere Runden hinweg. */
function statsFor(rounds){
  const byName = new Map();

  for (const r of rounds){
    if (!r.completedAt) continue;
    for (const p of r.players){
      const played = holesPlayed(r, p.id);
      if (!played) continue;

      const e = byName.get(p.name) || {
        name: p.name, rounds: 0, fullRounds: 0, holes: 0, strokes: 0, par: 0,
        best: null, counts: Object.assign({}, EMPTY_COUNTS),
        byPar: { 3: { holes: 0, strokes: 0 }, 4: { holes: 0, strokes: 0 },
                 5: { holes: 0, strokes: 0 }, 6: { holes: 0, strokes: 0 } }
      };

      e.rounds++;
      e.holes += played;
      e.strokes += totalStrokes(r, p.id);
      e.par += playedPar(r, p.id);

      const counts = scoreCounts(r, p.id);
      for (const k in counts) e.counts[k] += counts[k];

      const s = r.strokes[p.id];
      for (let i = 0; i < holeCount(r); i++){
        if (s[i] == null) continue;
        const bucket = e.byPar[r.pars[i]];
        if (bucket){ bucket.holes++; bucket.strokes += s[i]; }
      }

      // Nur vollstaendige Runden sind untereinander vergleichbar.
      if (played === holeCount(r)){
        e.fullRounds++;
        const tot = totalStrokes(r, p.id);
        if (!e.best || tot < e.best.strokes){
          e.best = { strokes: tot, toPar: toPar(r, p.id), course: r.courseName, date: r.date };
        }
      }

      byName.set(p.name, e);
    }
  }

  return [...byName.values()]
    .sort((a, b) => b.rounds - a.rounds || a.name.localeCompare(b.name, "de"));
}

/* Zuletzt benutzte Namen und Plaetze, neueste zuerst. */
function recentPlayers(rounds){
  const seen = new Map();
  for (let i = rounds.length - 1; i >= 0; i--){
    for (const p of rounds[i].players){
      const name = p.name.trim();
      if (name && !seen.has(name)) seen.set(name, { name, hcp: p.hcp });
    }
  }
  return [...seen.values()];
}

/* Mitgelieferte Vorlagen. Eine Runde faengt mit einer Form an, nicht mit 18
   leeren Feldern -- welche Form, ist die erste Frage auf dem Platz. */
const BUILTIN_PRESETS = [
  { name: "Golfplatz, 18 Loch", pars: defaultPars(18) },
  { name: "Golfplatz, 9 Loch",  pars: defaultPars(9) },
  { name: "Swingolf, 12 Bahnen", pars: new Array(12).fill(3) },
  { name: "Swingolf, 9 Bahnen",  pars: new Array(9).fill(3) }
];

/* Eine gespeicherte Vorlage. Der Name ist die Identitaet -- zwei Vorlagen
   gleichen Namens waeren im Auswahlmenue nicht auseinanderzuhalten. */
function normalizePreset(raw){
  if (!raw || typeof raw !== "object") return null;
  const name = String(raw.name || "").trim();
  if (!name) return null;

  const rawPars = Array.isArray(raw.pars) ? raw.pars : [];
  if (rawPars.length < MIN_HOLES) return null;
  const holes = clamp(rawPars.length, MIN_HOLES, MAX_HOLES);
  const fallback = defaultPars(holes);
  const pars = Array.from({ length: holes }, (_, i) => {
    const v = Number(rawPars[i]);
    return Number.isFinite(v) && v > 0 ? clamp(Math.round(v), MIN_PAR, MAX_PAR) : fallback[i];
  });

  return { id: String(raw.id || uid()), name: name.slice(0, 60), pars, si: resizeSi(raw.si, holes) };
}

/* Speichern ersetzt eine Vorlage gleichen Namens, statt eine zweite
   danebenzulegen. Neueste zuerst. */
function upsertPreset(presets, raw){
  const clean = normalizePreset(raw);
  if (!clean) return presets.slice();
  const key = clean.name.toLowerCase();
  return [clean].concat(presets.filter(p => p.name.toLowerCase() !== key));
}

function removePreset(presets, id){
  return presets.filter(p => p.id !== id);
}

/* Vorlagen zur Auswahl: eigene gespeicherte zuerst, dann gespielte Plaetze,
   zuletzt die mitgelieferten Formen. Gleiche Namen fallen weg -- die weiter
   oben stehende Quelle gewinnt. */
function presetList(rounds, presets){
  const out = [];
  const seen = new Set();
  const add = (name, pars, si, kind) => {
    const key = String(name).trim().toLowerCase();
    if (!key || seen.has(key)) return;
    seen.add(key);
    out.push({ name, pars: pars.slice(), si: si.slice(), kind });
  };

  for (const p of (presets || [])) add(p.name, p.pars, p.si, "saved");
  for (const c of recentCourses(rounds)) add(c.name, c.pars, c.si, "played");
  for (const b of BUILTIN_PRESETS) add(b.name, b.pars, defaultSi(b.pars.length), "builtin");
  return out;
}

function recentCourses(rounds){
  const seen = new Map();
  for (let i = rounds.length - 1; i >= 0; i--){
    const r = rounds[i];
    const name = r.courseName.trim();
    if (name && !seen.has(name)){
      seen.set(name, { name, pars: r.pars.slice(), si: r.si.slice() });
    }
  }
  return [...seen.values()];
}

function shareText(round){
  const board = leaderboard(round);
  const lines = [`${round.courseName || "Runde"} \u00b7 ${fmtDate(round.date)}`];
  board.forEach((e, i) => {
    lines.push(round.stableford
      ? `${i + 1}. ${e.name} \u2014 ${e.points} Punkte (${e.strokes} Schl\u00e4ge)`
      : `${i + 1}. ${e.name} \u2014 ${e.strokes} Schl\u00e4ge (${fmtToPar(e.toPar)})`);
  });
  lines.push(`Par ${sum(round.pars, 0, holeCount(round))}, ${holeCount(round)} Bahnen`);
  return lines.join("\n");
}

/* Vorlagen aus einer Sicherung dazunehmen. Ein bereits belegter Name bleibt
   unangetastet -- die Fassung auf diesem Geraet ist die juengere. */
function mergePresets(existing, incoming){
  const known = new Set(existing.map(p => p.name.toLowerCase()));
  const added = [];
  for (const raw of (incoming || [])){
    const pre = normalizePreset(raw);
    if (pre && !known.has(pre.name.toLowerCase())){ known.add(pre.name.toLowerCase()); added.push(pre); }
  }
  return { presets: existing.concat(added), added: added.length };
}

/* Fuehrt importierte Runden mit den vorhandenen zusammen. Gleiche id heisst
   gleiche Runde -- lieber ueberspringen als doppelt in der Historie. */
function mergeRounds(existing, incoming){
  const known = new Set(existing.map(r => r.id));
  const added = [];
  for (const raw of incoming){
    const r = normalizeRound(raw);
    if (r && !known.has(r.id)){ known.add(r.id); added.push(r); }
  }
  return { rounds: existing.concat(added), added: added.length,
           skipped: incoming.length - added.length };
}

/* =========================================================================
   Einstellungen
   ========================================================================= */

const THEMES = ["auto", "light", "dark"];
const THEME_LABELS = { auto: "Automatisch", light: "Hell", dark: "Dunkel" };

function normalizeSettings(raw){
  const s = raw && typeof raw === "object" ? raw : {};
  return { theme: THEMES.includes(s.theme) ? s.theme : "auto" };
}

/* "auto" heisst: dem Geraet folgen. Die Stylesheet-Regeln haengen an
   data-theme, deshalb wird das Attribut immer gesetzt -- auch fuer auto,
   damit die Media Query greift. */
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme",
    THEMES.includes(theme) ? theme : "auto");
}

/* =========================================================================
   Speicherung
   ========================================================================= */

const STORAGE_KEY = "swing-golf:v1";

function serialize(state){
  return JSON.stringify({
    version: 2,
    rounds: state.rounds,
    activeId: state.activeId,
    presets: state.presets,
    settings: state.settings
  });
}

function deserialize(raw){
  const empty = () => ({ rounds: [], activeId: null, presets: [], settings: normalizeSettings(null) });
  if (!raw) return empty();
  let data;
  try { data = JSON.parse(raw); } catch { return empty(); }
  if (!data || !Array.isArray(data.rounds)) return empty();

  const rounds = data.rounds.map(normalizeRound).filter(Boolean);
  return {
    rounds,
    activeId: rounds.some(r => r.id === data.activeId) ? data.activeId : null,
    // Version 1 kannte weder Vorlagen noch Einstellungen -- beides faellt
    // auf die Vorgabe zurueck, ohne dass die Runden darunter leiden.
    presets: (Array.isArray(data.presets) ? data.presets : []).map(normalizePreset).filter(Boolean),
    settings: normalizeSettings(data.settings)
  };
}

function loadState(){
  try { return deserialize(localStorage.getItem(STORAGE_KEY)); }
  catch { return deserialize(null); }
}

/* Gibt false zurueck, wenn nicht geschrieben werden konnte (privater Modus,
   volles Kontingent). Die App laeuft dann weiter, nur ohne Historie. */
function saveState(state){
  try { localStorage.setItem(STORAGE_KEY, serialize(state)); return true; }
  catch { return false; }
}

function firstOpenHole(round){
  const n = holeCount(round);
  for (let i = 0; i < n; i++){
    if (round.players.some(p => round.strokes[p.id][i] == null)) return i;
  }
  return n - 1;
}

  else if (v === "rounds") html += viewRounds();
  else if (v === "stats") html += viewStats();
  else if (v === "settings") html += viewSettings();
  else html += viewHome();

  if (TAB_VIEWS.includes(v)) html += tabbar(v);
  root.innerHTML = html;
}

function tabbar(current){
  return `<nav class="tabbar" aria-label="Hauptbereiche"><div class="inner">` +
    TABS.map(t => `<button data-act="tab" data-view="${t.view}"
      ${t.view === current ? 'aria-current="page"' : ""}>
      <span class="ic">${ICONS[t.icon]}</span>${t.label}</button>`).join("") +
    `</div></nav>`;
}

/* Kopfzeile. back: Ziel-Ansicht fuer den Zurueck-Pfeil, sonst ohne. */
function topbar(title, sub, back, right){
  return `<div class="topbar">
    ${back ? `<button data-act="go" data-view="${back}" aria-label="Zur&uuml;ck"
        style="padding:8px 6px">${ICONS.back}</button>` : ""}
    <h1>${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</h1>
    ${right || ""}
  </div>`;
}

/* ---------- Spielen ---------- */

function viewHome(){
  const round = state.rounds.find(r => r.id === state.activeId && !r.completedAt)
    || state.rounds.filter(r => !r.completedAt).slice(-1)[0] || null;

  let html = `<div class="screen tabbed">` + topbar("Swing Golf");

  if (round){
    const n = holeCount(round);
    const played = roundProgress(round);
    const hole = Math.min(played + 1, n);
    const board = leaderboard(round);
    html += `<div class="hero">
      <div class="eyebrow">L&auml;uft gerade</div>
      <div class="title truncate">${esc(round.courseName || "Runde ohne Namen")}</div>
      <div class="meta">${fmtDate(round.date)} &middot; ${round.players.length} Spieler${
        round.stableford ? " &middot; Stableford" : ""}</div>
      <div class="lead"><span class="n">${hole}</span>
        <span class="muted">von ${n} Bahnen</span></div>
      <div class="progress"><span style="width:${Math.round((played / n) * 100)}%"></span></div>
      <div class="stack" style="gap:6px; margin-bottom:16px">`;
    for (const e of board.slice(0, 4)){
      html += `<div class="spread small"><span class="truncate">${esc(e.name)}</span>
        <span class="muted" style="font-variant-numeric:tabular-nums">${
          round.stableford ? `${e.points} Pkt` : (e.played ? fmtToPar(e.toPar) : "&ndash;")}</span></div>`;
    }
    html += `</div>
      <button class="btn-primary btn-wide" data-act="resume">Weiterspielen</button>
    </div>
    <button class="btn-soft btn-wide" data-act="new">Neue Runde</button>`;
  } else {
    const letzte = state.rounds.filter(r => r.completedAt).slice(-1)[0];
    html += `<div class="hero">
      <div class="eyebrow">Bereit</div>
      <div class="title">Neue Runde</div>
      <div class="meta">Vorlage w&auml;hlen, Spieler eintragen, losz&auml;hlen.</div>
      <button class="btn-primary btn-wide" data-act="new">Los geht&rsquo;s</button>
    </div>`;
    if (letzte){
      const top = leaderboard(letzte)[0];
      html += `<button class="round-item" data-act="open" data-id="${letzte.id}">
        <span class="meta">
          <span class="title truncate">Zuletzt: ${esc(letzte.courseName || "Ohne Namen")}</span>
          <span class="small muted">${fmtDate(letzte.date)}${
            top ? ` &middot; ${esc(top.name)} mit ${top.strokes}` : ""}</span>
        </span></button>`;
    }
  }

  return html + `</div>`;
}

/* ---------- Runden ---------- */

function viewRounds(){
  const byDate = (a, b) => (b.date || "").localeCompare(a.date || "");
  const running = state.rounds.filter(r => !r.completedAt).sort(byDate);
  const done = state.rounds.filter(r => r.completedAt).sort(byDate);

  let html = `<div class="screen tabbed">` + topbar("Runden");

  if (!state.rounds.length){
    html += `<div class="card"><div class="empty"><span class="big">${ICONS.flag}</span>
      Noch keine Runde.<br>Fang auf der Startseite eine an.</div></div>`;
    return html + `</div>`;
  }

  if (running.length){
    html += `<p class="sect">Laufend</p><div class="stack" style="margin-bottom:20px">`;
    for (const r of running) html += roundItem(r, true);
    html += `</div>`;
  }
  if (done.length){
    html += `<p class="sect">Abgeschlossen</p><div class="stack">`;
    for (const r of done) html += roundItem(r, false);
    html += `</div>`;
  } else {
    html += `<div class="card"><div class="empty">Noch keine Runde abgeschlossen.</div></div>`;
  }

  return html + `</div>`;
}

function roundItem(round, isRunning){
  const board = leaderboard(round);
  const top = board[0];
  const played = roundProgress(round);
  const n = holeCount(round);
  const title = round.courseName || "Ohne Platznamen";
  const sub = isRunning
    ? `${fmtDate(round.date)} &middot; Bahn ${Math.min(played + 1, n)} von ${n}`
    : `${fmtDate(round.date)} &middot; ${n} Bahnen${top ? ` &middot; ${esc(top.name)}` : ""}`;

  return `<div class="row" style="gap:8px">
    <button class="round-item grow" data-act="open" data-id="${round.id}">
      <span class="meta">
        <span class="title truncate">${esc(title)}</span>
        <span class="small muted truncate">${sub}</span>
      </span>
      ${top && played ? `<span class="score">${
        round.stableford ? `${top.points}<span class="muted small"> Pkt</span>`
                         : `${top.strokes} <span class="muted small">${fmtToPar(top.toPar)}</span>`
      }</span>` : ""}
      ${isRunning ? `<span class="badge">weiter</span>` : ""}
    </button>
    <button class="btn-danger" data-act="del" data-id="${round.id}"
      aria-label="Runde l&ouml;schen" style="flex:0 0 46px; padding:0; min-height:56px">&#10005;</button>
  </div>`;
}

/* ---------- Einstellungen ---------- */

function viewSettings(){
  const t = state.settings.theme;
  let html = `<div class="screen tabbed">` + topbar("Mehr");

  html += `<div class="card">
    <p class="sect">Darstellung</p>
    <div class="segment" role="group" aria-label="Darstellung">` +
    THEMES.map(k => `<button data-act="theme" data-theme="${k}"
      aria-pressed="${k === t}">${THEME_LABELS[k]}</button>`).join("") +
    `</div>
    <p class="hint">Automatisch folgt der Einstellung des Ger&auml;ts.</p>
  </div>`;

  html += `<div class="stack" style="margin-bottom:var(--gap)">
    <button class="link-row" data-act="go" data-view="presets">
      <span class="ic">${ICONS.layers}</span>
      <span class="t"><b>Vorlagen</b><span>${state.presets.length} gespeichert</span></span>
      <span class="arrow">&rsaquo;</span></button>
    <button class="link-row" data-act="go" data-view="data">
      <span class="ic">${ICONS.save}</span>
      <span class="t"><b>Daten</b><span>Sichern und zur&uuml;ckholen</span></span>
      <span class="arrow">&rsaquo;</span></button>
    <button class="link-row" data-act="go" data-view="impressum">
      <span class="ic">${ICONS.info}</span>
      <span class="t"><b>Impressum</b><span>Angaben und Datenschutz</span></span>
      <span class="arrow">&rsaquo;</span></button>
  </div>`;

  html += `<p class="hint" style="text-align:center">Alle Runden liegen nur auf diesem
    Ger&auml;t. Nichts wird hochgeladen.</p>`;
  return html + `</div>`;
}

/* ---------- Vorlagen verwalten ---------- */

function viewPresets(){
  let html = `<div class="screen plain">` + topbar("Vorlagen", null, "settings");

  if (!state.presets.length){
    html += `<div class="card"><div class="empty"><span class="big">${ICONS.layers}</span>
      Noch keine eigene Vorlage.<br>Beim Anlegen einer Runde lassen sich Bahnen,
      Par und Stroke-Index als Vorlage sichern.</div></div>`;
  } else {
    html += `<div class="stack">`;
    for (const pre of state.presets){
      const total = pre.pars.reduce((a, b) => a + b, 0);
      html += `<div class="row" style="gap:8px">
        <span class="round-item grow" style="cursor:default">
          <span class="meta">
            <span class="title truncate">${esc(pre.name)}</span>
            <span class="small muted">${pre.pars.length} Bahnen &middot; Par ${total}</span>
          </span></span>
        <button class="btn-danger" data-act="del-preset" data-id="${pre.id}"
          aria-label="Vorlage l&ouml;schen" style="flex:0 0 46px; padding:0; min-height:56px">&#10005;</button>
      </div>`;
    }
    html += `</div>`;
  }

  html += `<p class="hint">Gespielte Pl&auml;tze schlage ich ohnehin vor &ndash; gespeicherte
    Vorlagen stehen dar&uuml;ber und bleiben auch dann, wenn du die Runde l&ouml;schst.</p>`;
  return html + `</div>`;
}

function viewSetup(){
  const d = state.draft;
  const n = d.pars.length;
  const parTotal = d.pars.reduce((a, b) => a + b, 0);
  const presets = presetList(state.rounds, state.presets);
  const taken = new Set(d.players.map(p => p.name.trim()).filter(Boolean));
  const people = recentPlayers(state.rounds).filter(p => !taken.has(p.name));

  let html = `<div class="screen plain">` + topbar("Neue Runde", null, "home");

  /* Mehrere Vorlagen koennen dieselbe Form haben (ein gespielter 18-Loch-Platz
     und "Golfplatz, 18 Loch"). Dann bekommt nur die erste den Haken, sonst
     sieht es aus, als waeren zwei gewaehlt. Die Markierung haengt an den
     Werten, nicht an einem gemerkten Namen -- wer danach das Par aendert,
     verliert sie automatisch. */
  const passt = pre => pre.pars.length === n && pre.pars.every((v, k) => v === d.pars[k]);
  const aktivIdx = presets.findIndex(passt);

  html += `<div class="card"><p class="sect">Vorlage</p><div class="stack">`;
  presets.slice(0, 8).forEach((pre, i) => {
    const total = pre.pars.reduce((a, b) => a + b, 0);
    const aktiv = i === aktivIdx;
    html += `<button class="preset${aktiv ? " on" : ""}" data-act="use-preset" data-i="${i}">
      <span class="grow">
        <span class="title truncate">${esc(pre.name)}${
          pre.kind === "saved" ? `<span class="tag">eigene</span>`
          : pre.kind === "played" ? `<span class="tag">gespielt</span>` : ""}</span>
        <span class="small muted">${pre.pars.length} Bahnen &middot; Par ${total}</span>
      </span>
      ${aktiv ? `<span class="tick" aria-label="gew&auml;hlt">&#10003;</span>` : ""}
    </button>`;
  });
  html += `</div><p class="small muted" style="margin:10px 0 0">Alles darunter
    l&auml;sst sich danach noch einzeln &auml;ndern.</p></div>`;

  html += `<div class="card"><p class="sect">Platz</p><div class="stack">
    <input type="text" data-field="courseName" value="${esc(d.courseName)}"
      placeholder="Platzname" autocomplete="off" enterkeyhint="done">
    <input type="date" data-field="date" value="${esc(d.date)}">
  </div></div>`;

  html += `<div class="card"><p class="sect">Spieler</p><div class="stack">`;
  d.players.forEach((p, i) => {
    html += `<div class="row">
      <input class="grow" type="text" data-field="player" data-id="${p.id}"
        value="${esc(p.name)}" placeholder="Spieler ${i + 1}" autocomplete="off" enterkeyhint="done">
      <input type="number" data-field="hcp" data-id="${p.id}" value="${p.hcp}"
        min="0" max="${MAX_HCP}" step="1" aria-label="Spielvorgabe f&uuml;r Spieler ${i + 1}"
        style="flex:0 0 76px; text-align:center">
      <button class="btn-danger" data-act="rm-player" data-id="${p.id}"
        aria-label="Spieler entfernen" style="flex:0 0 46px; padding:0"
        ${d.players.length <= 1 ? "disabled" : ""}>&#10005;</button>
    </div>`;
  });
  html += `<p class="small muted" style="margin:0">Das schmale Feld ist die Spielvorgabe
    (0 = ohne). Sie z&auml;hlt nur f&uuml;r Stableford.</p>`;
  if (people.length){
    html += `<div class="chips-row">` + people.slice(0, 8).map((p, i) =>
      `<button class="chip-btn" data-act="use-player" data-i="${i}">+ ${esc(p.name)}</button>`
    ).join("") + `</div>`;
  }
  if (d.players.length < MAX_PLAYERS){
    html += `<button data-act="add-player">+ Spieler hinzuf&uuml;gen</button>`;
  } else {
    html += `<p class="small muted" style="margin:0">Maximal ${MAX_PLAYERS} Spieler.</p>`;
  }
  html += `</div></div>`;

  html += `<div class="card" style="padding:0; overflow:hidden">
    <button class="switch" data-act="toggle-stableford" aria-pressed="${d.stableford}"
      style="border:none; border-radius:0">
      <span class="box" aria-hidden="true">${d.stableford ? "&#10003;" : ""}</span>
      <span class="lbl"><b>Stableford z&auml;hlen</b>
        <span>Punkte statt Schl&auml;ge, netto nach Spielvorgabe</span></span>
    </button>
  </div>`;

  html += `<div class="card">
    <p class="sect">Bahnen</p>
    <div class="stepper" style="margin:0 0 10px">
      <button class="step" data-act="holes" data-delta="-1"
        aria-label="Eine Bahn weniger" ${n <= MIN_HOLES ? "disabled" : ""}>&minus;</button>
      <div class="value"><span class="n">${n}</span>
        <span class="lbl">Bahnen</span></div>
      <button class="step" data-act="holes" data-delta="1"
        aria-label="Eine Bahn mehr" ${n >= MAX_HOLES ? "disabled" : ""}>+</button>
    </div>
    <div class="chips-row">` +
      [6, 9, 12, 18].map(v =>
        `<button class="chip-btn${v === n ? " on" : ""}" data-act="holes-set" data-n="${v}">${v}</button>`
      ).join("") + `</div>
    <p class="small muted" style="margin:8px 0 0">${MIN_HOLES} bis ${MAX_HOLES} Bahnen.
      Vorhandene Bahnen behalten ihr Par, neue bekommen das h&auml;ufigste Par
      dieser Runde.</p>
  </div>`;

  /* Wer eine Vorlage nimmt, will das Par nicht Bahn fuer Bahn sehen. Es
     steht als eine Zeile da und klappt nur auf, wenn jemand es braucht. */
  html += `<div class="card">
    <button class="switch" data-act="toggle-par" aria-expanded="${state.showPar}"
      style="padding:0; background:none">
      <span class="lbl"><b>Par je Bahn</b>
        <span>Gesamt ${parTotal} &middot; ${n} Bahnen</span></span>
      <span class="muted" style="font-size:20px">${state.showPar ? "&minus;" : "+"}</span>
    </button>`;
  if (state.showPar){
    html += `<div class="par-grid" style="margin-top:14px">`;
    d.pars.forEach((par, i) => {
      html += `<button class="par-cell" data-act="cycle-par" data-hole="${i}"
        aria-label="Bahn ${i + 1}, Par ${par}, tippen zum &Auml;ndern">
        <span class="hole">${i + 1}</span><span class="val">${par}</span></button>`;
    });
    html += `</div>
      <div class="row" style="margin-top:10px">
        <button class="btn-soft small grow" data-act="reset-par">Standard-Par</button>
      </div>
      <p class="hint">Tippen schaltet ${MIN_PAR}&rarr;${MAX_PAR}&rarr;${MIN_PAR} weiter.</p>`;
  }
  html += `</div>`;

  html += `<button class="btn-soft btn-wide" data-act="save-preset"
    style="margin-bottom:var(--gap)">Als Vorlage sichern</button>`;

  if (d.stableford){
    const valid = new Set(d.si).size === n;
    html += `<div class="card">
      <p class="sect">Stroke-Index</p>
      <p class="small muted" style="margin:-4px 0 10px">Welche Bahn den wievielten
        Vorschlag bekommt &ndash; steht auf der Scorekarte des Platzes. Jede Zahl
        von 1 bis ${n} genau einmal.</p>
      <div class="si-grid">`;
    d.si.forEach((v, i) => {
      html += `<label class="si-cell">${i + 1}
        <select data-field="si" data-hole="${i}" aria-label="Stroke-Index Bahn ${i + 1}">` +
        defaultSi(n).map(k => `<option value="${k}"${k === v ? " selected" : ""}>${k}</option>`).join("") +
        `</select></label>`;
    });
    html += `</div>`;
    if (!valid){
      html += `<p class="small" style="color:var(--danger); margin:10px 0 0">
        Jede Zahl darf nur einmal vorkommen &ndash; sonst wird beim Start die
        Bahnreihenfolge verwendet.</p>`;
    }
    html += `<div class="row" style="margin-top:10px">
      <button class="btn-soft small grow" data-act="reset-si">Bahnreihenfolge wiederherstellen</button>
    </div></div>`;
  }

  html += `<button class="btn-primary" data-act="start" style="width:100%">Runde starten</button>`;
  return html + `</div>`;
}

/* ---------- Bahn-Eingabe und Scorekarte ---------- */

function viewPlay(){
  const round = activeRound();
  if (!round){ state.view = "home"; return viewHome(); }
  return state.table ? playTable(round) : playHole(round);
}

function playHole(round){
  const i = state.hole;
  const par = round.pars[i];

  let html = `<div class="screen plain">` + topbar(
    round.courseName || "Runde", fmtDate(round.date), "home",
    `<button data-act="toggle-table">Karte</button>`);

  html += `<div class="hole-head">
    <div class="no">Bahn ${i + 1} von ${holeCount(round)}</div>
    <div class="par">Par ${par}</div>
  </div>`;

  for (const p of round.players){
    const v = round.strokes[p.id][i];
    const lbl = scoreLabel(v, par);
    const recv = round.stableford ? strokesReceived(p.hcp, round.si, i) : 0;
    const pts = round.stableford ? holePoints(round, p.id, i) : null;
    const running = round.stableford
      ? `${totalPoints(round, p.id)} Pkt`
      : fmtToPar(toPar(round, p.id));
    html += `<div class="player-card">
      <div class="name"><span class="truncate">${esc(p.name)}</span>
        ${recv ? `<span class="small muted">+${recv}</span>` : ""}
        <span class="running">Runde ${running}</span></div>
      <div class="stepper">
        <button class="step" data-act="stroke" data-id="${p.id}" data-delta="-1"
          aria-label="Ein Schlag weniger f&uuml;r ${esc(p.name)}">&minus;</button>
        <div class="value">
          <span class="n ${lbl.cls}">${v == null ? "&ndash;" : v}</span>
          <span class="lbl ${lbl.cls}">${lbl.label}${
            pts != null ? ` &middot; ${pts} Pkt` : ""}</span>
        </div>
        <button class="step" data-act="stroke" data-id="${p.id}" data-delta="1"
          aria-label="Ein Schlag mehr f&uuml;r ${esc(p.name)}">+</button>
        <button class="clear" data-act="clear-stroke" data-id="${p.id}"
          aria-label="Eintrag f&uuml;r ${esc(p.name)} l&ouml;schen"
          ${v == null ? "disabled" : ""}>&#8635;</button>
      </div>
    </div>`;
  }

  const last = i === holeCount(round) - 1;
  html += `<div class="navbar">
    <button data-act="prev-hole" ${i === 0 ? "disabled" : ""}>&larr; Bahn</button>
    <span class="pos">${i + 1}/${holeCount(round)}</span>
    ${last
      ? `<button class="btn-primary" data-act="finish">Runde beenden</button>`
      : `<button data-act="next-hole">Bahn &rarr;</button>`}
  </div>`;
  return html + `</div>`;
}

function playTable(round){
  const cols = tableColumns(round);

  let html = `<div class="screen plain">` + topbar(
    round.courseName || "Runde", "Scorekarte", "home",
    `<button data-act="toggle-table">${round.completedAt ? "Ergebnis" : "Bahn"}</button>`);

  html += printHead(round);

  const head = cols.map(c => c.sum
    ? `<th>${c.label}</th>`
    : `<th>${c.hole + 1}</th>`).join("");

  const parCells = cols.map(c => c.sum
    ? `<td class="sum">${sum(round.pars, c.sum[0], c.sum[1])}</td>`
    : parCell(round, c.hole)).join("");

  let body = "";
  for (const p of round.players){
    const s = round.strokes[p.id];
    const cells = cols.map(c => c.sum
      ? `<td class="sum">${totalStrokes(round, p.id, c.sum[0], c.sum[1]) || "&middot;"}</td>`
      : strokeCell(s[c.hole], round.pars[c.hole])).join("");
    body += `<tr><th class="name-col" scope="row">${esc(p.name)}</th>${cells}</tr>`;
  }

  html += `<div class="table-wrap"><table class="card-table">
    <thead><tr><th class="name-col">Bahn</th>${head}</tr></thead>
    <tbody>
      <tr class="par-row"><th class="name-col" scope="row">Par</th>${parCells}</tr>
      ${body}
    </tbody></table></div>`;

  html += `<div class="card" style="margin-top:12px"><div class="stack">`;
  for (const e of leaderboard(round)){
    html += `<div class="spread"><span class="truncate">${esc(e.name)}</span>
      <span style="font-variant-numeric:tabular-nums">${
        round.stableford
          ? `<strong>${e.points}</strong> <span class="muted small">Pkt &middot; ${e.strokes || 0} Schl&auml;ge</span>`
          : `<strong>${e.strokes || 0}</strong> <span class="muted small">${e.played ? fmtToPar(e.toPar) : "&ndash;"}</span>`
      }</span></div>`;
  }
  html += `</div></div>`;
  html += `<p class="hint">Seitlich wischen f&uuml;r die hinteren Bahnen und die Summen.
    Par antippen, um ihn zu korrigieren.</p>`;

  html += `<div class="navbar">
    <button class="btn-soft" data-act="print">Drucken</button>
    ${round.completedAt
      ? `<button data-act="summary">Zur Auswertung</button>`
      : `<button class="btn-primary" data-act="finish">Runde beenden</button>`}
  </div>`;
  return html + `</div>`;
}

/* Spaltenfolge der Karte: die Bahnen, dazwischen Out, am Ende In und Gesamt.
   Laesst sich die Runde nicht halbieren, entfaellt Out/In und es bleibt die
   Gesamtsumme. */
/* Steht nur im Ausdruck: Platz, Datum und Besetzung als Kopf der Karte.
   Am Bildschirm sagt das die Kopfzeile, die beim Drucken verschwindet. */
function printHead(round){
  const n = holeCount(round);
  return `<div class="print-head">
    <div class="t">${esc(round.courseName || "Swing Golf")}</div>
    <div class="m">${fmtDate(round.date)} &middot; ${n} Bahnen &middot; Par ${
      sum(round.pars, 0, n)}${round.stableford ? " &middot; Stableford" : ""}
      &middot; ${round.players.map(p => esc(p.name)).join(", ")}</div>
  </div>`;
}

function tableColumns(round){
  const n = holeCount(round);
  const half = halfPoint(n);
  const cols = [];
  for (let i = 0; i < n; i++){
    cols.push({ hole: i });
    if (half && i + 1 === half) cols.push({ sum: [0, half], label: "Out" });
  }
  if (half) cols.push({ sum: [half, n], label: "In" });
  cols.push({ sum: [0, n], label: "Ges" });
  return cols;
}

function parCell(round, i){
  return `<td class="par-editable" data-act="cycle-par-live" data-hole="${i}">${round.pars[i]}</td>`;
}

function strokeCell(v, par){
  if (v == null) return `<td class="empty-cell">&middot;</td>`;
  return `<td class="${scoreLabel(v, par).cls}"><strong>${v}</strong></td>`;
}

function sum(arr, from, to){
  let s = 0;
  for (let i = from; i < to; i++) s += arr[i];
  return s;
}

/* ---------- Auswertung ---------- */

const COUNT_LABELS = [
  ["ace", "Hole-in-One"], ["eagle", "Eagle"], ["birdie", "Birdie"],
  ["par", "Par"], ["bogey", "Bogey"], ["double", "Doppelbogey+"]
];

const SCORE_CLASS = {
  ace: "s-ace", eagle: "s-eagle", birdie: "s-birdie",
  par: "s-par", bogey: "s-bogey", double: "s-double"
};

  const round = activeRound();

          : `<span class="strokes">${e.strokes}</span>
             <span class="rel">${fmtToPar(e.toPar)}</span>`

    <button data-act="share">Ergebnis teilen</button>

  return html + `</div>`;
}

/* ---------- Statistik ---------- */

function fmtAvg(n, digits = 1){
  return Number.isFinite(n) ? n.toFixed(digits).replace(".", ",") : "&ndash;";
}

/* Wie fmtToPar, nur mit Nachkommastellen: genau auf Par bleibt "E". */
function fmtRelAvg(n){
  if (!Number.isFinite(n)) return "&ndash;";
  const s = fmtAvg(Math.abs(n), 2);
  if (Number(s.replace(",", ".")) === 0) return "E";
  return (n > 0 ? "+" : "\u2212") + s;
}

function viewStats(){
  const rows = statsFor(state.rounds);

  let html = `<div class="screen tabbed">` + topbar("Statistik",
    "\u00fcber alle abgeschlossenen Runden");

  if (!rows.length){
    html += `<div class="card"><div class="empty"><span class="big">${ICONS.chart}</span>
      Noch nichts zu z&auml;hlen.<br>Schlie&szlig;e erst eine Runde ab.</div></div>`;
    return html + `</div>`;
  }

  for (const e of rows){
    const perHole = e.strokes / e.holes;
    const parPerHole = (e.strokes - e.par) / e.holes;

    html += `<div class="card">
      <div class="spread"><span class="stat-name">${esc(e.name)}</span>
        <span class="small muted">${e.rounds} Runde${e.rounds === 1 ? "" : "n"}</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${fmtAvg(perHole, 2)}</div>
          <div class="k">Schl&auml;ge je Bahn</div></div>
        <div class="stat"><div class="v">${fmtRelAvg(parPerHole)}</div>
          <div class="k">zu Par je Bahn</div></div>
        <div class="stat"><div class="v">${e.best ? e.best.strokes : "&ndash;"}</div>
          <div class="k">${e.best
            ? `beste Runde (${fmtToPar(e.best.toPar)})`
            : "keine volle Runde"}</div></div>
        <div class="stat"><div class="v">${e.holes}</div>
          <div class="k">Bahnen gez&auml;hlt</div></div>
      </div>`;

    if (e.best && e.best.course){
      html += `<p class="small muted" style="margin:0 0 8px">Beste Runde:
        ${esc(e.best.course)}, ${fmtDate(e.best.date)}</p>`;
    }

    const max = Math.max(1, ...COUNT_LABELS.map(([k]) => e.counts[k]));
    html += `<div class="bars">`;
    for (const [k, label] of COUNT_LABELS){
      const n = e.counts[k];
      if (!n) continue;
      const pct = Math.round((n / e.holes) * 100);
      html += `<div class="bar">
        <span class="${SCORE_CLASS[k]}">${label}</span>
        <span class="track"><span class="fill" style="width:${(n / max) * 100}%"></span></span>
        <span class="n">${n}</span>
      </div>`;
    }
    html += `</div>`;

    const pars = [3, 4, 5, 6].filter(x => e.byPar[x].holes > 0);
    if (pars.length){
      html += `<p class="small muted" style="margin:10px 0 0">Schnitt je Bahnart: ` +
        pars.map(x => `Par ${x} <strong>${fmtAvg(e.byPar[x].strokes / e.byPar[x].holes, 2)}</strong>`)
            .join(" &middot; ") + `</p>`;
    }
    html += `</div>`;
  }

  return html + `</div>`;
}

const ACTIONS = {
  new(){
    state.draft = makeRound("", todayISO(), [makePlayer(""), makePlayer("")],
      defaultPars(DEFAULT_HOLES), { stableford: false });
    state.showPar = false;
    state.view = "setup";
  },

  home(){
    state.view = "home";
    state.table = false;
    state.dataMsg = "";
  },

  tab(el){
    state.view = el.dataset.view;
    state.table = false;
    state.dataMsg = "";
  },

  go(el){
    state.view = el.dataset.view;
    if (el.dataset.view !== "data") state.dataMsg = "";
  },

  resume(){
    const round = state.rounds.find(r => r.id === state.activeId && !r.completedAt)
      || state.rounds.filter(r => !r.completedAt).slice(-1)[0];
    if (!round) return;
    state.activeId = round.id;
    state.hole = firstOpenHole(round);
    state.table = false;
    state.view = "play";
    persist();
  },

  theme(el){
    state.settings.theme = THEMES.includes(el.dataset.theme) ? el.dataset.theme : "auto";
    applyTheme(state.settings.theme);
    persist();
  },

  print(){
    window.print();
  },

  "save-preset"(){
    const d = state.draft;
    if (!d) return;
    const vorschlag = d.courseName.trim() || `${d.pars.length} Bahnen, Par ${
      d.pars.reduce((a, b) => a + b, 0)}`;
    const name = prompt("Name der Vorlage:", vorschlag);
    if (name === null) return;                       // abgebrochen
    state.presets = upsertPreset(state.presets,
      { name, pars: d.pars.slice(), si: d.si.slice() });
    persist();
  },

  "del-preset"(el){
    const pre = state.presets.find(x => x.id === el.dataset.id);
    if (!pre) return;
    if (!confirm(`Vorlage "${pre.name}" l\u00f6schen?`)) return;
    state.presets = removePreset(state.presets, pre.id);
    persist();
  },

  open(el){
    const round = state.rounds.find(r => r.id === el.dataset.id);
    if (!round) return;
    state.activeId = round.id;
    state.table = false;
    state.hole = firstOpenHole(round);
    state.view = round.completedAt ? "summary" : "play";
    persist();
  },

  del(el){
    const round = state.rounds.find(r => r.id === el.dataset.id);
    if (!round) return;
    const name = round.courseName || "diese Runde";
    if (!isRoundEmpty(round) && !confirm(`"${name}" vom ${fmtDate(round.date)} löschen?`)) return;
    state.rounds = state.rounds.filter(r => r.id !== round.id);
    if (state.activeId === round.id) state.activeId = null;
    persist();
  },

  "add-player"(){
    if (state.draft.players.length >= MAX_PLAYERS) return;
    state.draft.players.push(makePlayer(""));
  },

  "rm-player"(el){
    if (state.draft.players.length <= 1) return;
    state.draft.players = state.draft.players.filter(p => p.id !== el.dataset.id);
  },

  "cycle-par"(el){
    const i = Number(el.dataset.hole);
    state.draft.pars[i] = state.draft.pars[i] >= MAX_PAR ? MIN_PAR : state.draft.pars[i] + 1;
  },

  "cycle-par-live"(el){
    const round = activeRound();
    if (!round) return;
    const i = Number(el.dataset.hole);
    round.pars[i] = round.pars[i] >= MAX_PAR ? MIN_PAR : round.pars[i] + 1;
    persist();
  },

  "reset-par"(){
    state.draft.pars = defaultPars(state.draft.pars.length);
  },

  "reset-si"(){
    state.draft.si = defaultSi(state.draft.pars.length);
  },

  holes(el){
    resizeDraft(state.draft, state.draft.pars.length + Number(el.dataset.delta));
  },

  "holes-set"(el){
    resizeDraft(state.draft, Number(el.dataset.n));
  },

  "toggle-par"(){
    state.showPar = !state.showPar;
  },

  "toggle-stableford"(){
    state.draft.stableford = !state.draft.stableford;
  },

  "use-preset"(el){
    const pre = presetList(state.rounds, state.presets)[Number(el.dataset.i)];
    if (!pre) return;
    state.draft.pars = pre.pars.slice();
    state.draft.si = pre.si.slice();
    // Ein echter Platz bringt seinen Namen mit, eine allgemeine Form nicht.
    if (pre.kind !== "builtin") state.draft.courseName = pre.name;
  },

  "use-player"(el){
    if (state.draft.players.length >= MAX_PLAYERS) return;
    const taken = new Set(state.draft.players.map(p => p.name.trim()).filter(Boolean));
    const person = recentPlayers(state.rounds).filter(p => !taken.has(p.name))[Number(el.dataset.i)];
    if (!person) return;
    // Eine noch leere Zeile fuellen, statt eine weitere danebenzusetzen.
    const empty = state.draft.players.find(p => !p.name.trim());
    if (empty){ empty.name = person.name; empty.hcp = person.hcp; }
    else state.draft.players.push(makePlayer(person.name, person.hcp));
  },

  start(){
    const d = state.draft;
    d.players.forEach((p, i) => { if (!p.name.trim()) p.name = "Spieler " + (i + 1); });
    const round = makeRound(d.courseName.trim(), d.date, d.players, d.pars,
      { si: d.si, stableford: d.stableford });
    state.rounds.push(round);
    state.activeId = round.id;
    state.draft = null;
    state.hole = 0;
    state.table = false;
    state.view = "play";
    persist();
  },

  stroke(el){
    const round = activeRound();
    if (!round) return;
    const id = el.dataset.id;
    const i = state.hole;
    round.strokes[id][i] = bumpStroke(round.strokes[id][i], round.pars[i], Number(el.dataset.delta));
    persist();
  },

  "clear-stroke"(el){
    const round = activeRound();
    if (!round) return;
    round.strokes[el.dataset.id][state.hole] = null;
    persist();
  },

  "prev-hole"(){ state.hole = Math.max(0, state.hole - 1); },
  "next-hole"(){
    const round = activeRound();
    state.hole = Math.min((round ? holeCount(round) : 1) - 1, state.hole + 1);
  },

  "toggle-table"(){
    const round = activeRound();
    if (state.table && round && round.completedAt){ state.view = "summary"; state.table = false; return; }
    state.table = !state.table;
  },

  "show-card"(){ state.table = true; state.view = "play"; },

  summary(){ state.table = false; state.view = "summary"; },

  finish(){
    const round = activeRound();
    if (!round) return;
    const open = holeCount(round) - roundProgress(round);
    if (open > 0 && !confirm(`${open} Bahn${open === 1 ? "" : "en"} ohne Eintrag. Runde trotzdem beenden?`)) return;
    round.completedAt = new Date().toISOString();
    state.table = false;
    state.view = "summary";
    persist();
  },

  reopen(){
    const round = activeRound();
    if (!round) return;
    round.completedAt = null;
    state.hole = firstOpenHole(round);
    state.view = "play";
    persist();
  },

  /* navigator.share braucht eine echte Nutzergeste. Der Klick-Handler ruft
     diese Funktion synchron auf, und share() ist das erste await -- damit
     bleibt die Geste gueltig. */
  async share(){
    const round = activeRound();
    if (!round) return;
    const text = shareText(round);
    try {
      if (navigator.share){
        await navigator.share({ title: round.courseName || "Swing Golf", text });
        return;
      }
      await navigator.clipboard.writeText(text);
      alert("Ergebnis in die Zwischenablage kopiert.");
    } catch (err){
      if (err && err.name === "AbortError") return;   // Nutzer hat abgebrochen
      alert(text);                                     // letzter Ausweg: zum Abschreiben
    }
  },

  "export-json"(){
    const blob = new Blob([serialize(state)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `swing-golf-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    state.dataMsg = `${state.rounds.length} Runde(n) als Datei gesichert.`;
  },

  "import-json"(){
    const input = document.getElementById("importFile");
    if (input) input.click();
  }
};

root.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || !root.contains(el)) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  fn(el);
  render();
});

/* Texteingaben aktualisieren das Modell ohne Neuzeichnen -- sonst verliert
   das Feld bei jedem Tastendruck den Fokus. */
root.addEventListener("input", ev => {
  const el = ev.target.closest("[data-field]");
  if (!el || !state.draft) return;
  const field = el.dataset.field;
  if (field === "player"){
    const p = state.draft.players.find(p => p.id === el.dataset.id);
    if (p) p.name = el.value;
  } else if (field === "hcp"){
    const p = state.draft.players.find(p => p.id === el.dataset.id);
    if (p) p.hcp = clamp(Math.round(Number(el.value) || 0), 0, MAX_HCP);
  } else if (field === "courseName" || field === "date"){
    state.draft[field] = el.value;
  }
});

/* Auswahlfelder und der Datei-Dialog laufen ueber change, nicht input. */
root.addEventListener("change", ev => {
  const si = ev.target.closest('[data-field="si"]');
  if (si && state.draft){
    state.draft.si[Number(si.dataset.hole)] = Number(si.value);
    render();                       // die Doppelt-Warnung muss mitziehen
    return;
  }

  const file = ev.target.id === "importFile" ? ev.target : null;
  if (!file || !file.files || !file.files[0]) return;

  const reader = new FileReader();
  reader.onerror = () => { state.dataMsg = "Die Datei konnte nicht gelesen werden."; render(); };
  reader.onload = () => {
    let data;
    try { data = JSON.parse(String(reader.result)); }
    catch { state.dataMsg = "Die Datei ist kein g\u00fcltiges JSON."; render(); return; }

    const incoming = Array.isArray(data) ? data
      : (data && Array.isArray(data.rounds) ? data.rounds : null);
    if (!incoming){ state.dataMsg = "In der Datei stehen keine Runden."; render(); return; }

    const merged = mergeRounds(state.rounds, incoming);
    state.rounds = merged.rounds;

    // Vorlagen stecken mit in der Sicherung und gehoeren mit zurueck.
    // Die Darstellung bleibt aussen vor -- die gehoert zum Geraet, nicht zur Datei.
    const vorlagen = mergePresets(state.presets, data && data.presets);
    state.presets = vorlagen.presets;

    persist();
    state.dataMsg = `${merged.added} Runde(n) \u00fcbernommen, ${merged.skipped} `
      + `\u00fcbersprungen (schon vorhanden oder unbrauchbar)`
      + (vorlagen.added ? `, dazu ${vorlagen.added} Vorlage(n).` : ".");
    render();
  };
  reader.readAsText(file.files[0]);
});

/* =========================================================================
   Selbsttest: index.html?selftest=1
   ========================================================================= */

function runSelfTest(){
  const results = [];
  const check = (name, fn) => {
    try {
      const detail = fn();
      results.push({ name, ok: true, detail: detail || "" });
    } catch (err){
      results.push({ name, ok: false, detail: String(err && err.message || err) });
    }
  };
  const eq = (actual, expected, what) => {
    const a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`${what || ""} erwartet ${b}, war ${a}`);
  };

  const demo = () => {
    const r = makeRound("Testplatz", "2026-05-01",
      [{ id: "a", name: "Anna" }, { id: "b", name: "Ben" }], defaultPars(18));
    // Anna: Bahn 1 Birdie (3 auf Par 4), Bahn 2 Par, Bahn 3 Doppelbogey (5 auf Par 3)
    r.strokes.a[0] = 3; r.strokes.a[1] = 4; r.strokes.a[2] = 5;
    // Ben: Bahn 1 Bogey, Bahn 2 offen, Bahn 3 Par
    r.strokes.b[0] = 5; r.strokes.b[2] = 3;
    return r;
  };

  check("Par-Vorlage: 18 Bahnen, Summe 72", () => {
    eq(defaultPars(18).length, 18, "Anzahl Bahnen");
    eq(sum(defaultPars(18), 0, 18), 72, "Par gesamt");
    eq(sum(defaultPars(9), 0, 9), 36, "neun Bahnen ergeben 36");
    eq(defaultPars(20).slice(18), PAR_PATTERN.slice(0, 2), "wird zyklisch fortgesetzt");
    return "Out " + sum(defaultPars(18), 0, 9) + " / In " + sum(defaultPars(18), 9, 18);
  });

  check("makeRound legt 18 leere Bahnen je Spieler an", () => {
    const r = makeRound("X", "2026-01-01", [makePlayer("A")], defaultPars(18));
    const s = r.strokes[r.players[0].id];
    eq(s.length, 18, "Bahnen");
    eq(s.every(v => v === null), true, "alle leer");
  });

  check("totalStrokes ignoriert leere Bahnen", () => {
    eq(totalStrokes(demo(), "a"), 12, "Anna");
    eq(totalStrokes(demo(), "b"), 8, "Ben");
  });

  check("toPar rechnet nur gespielte Bahnen", () => {
    const r = demo();
    // Anna: 12 Schlaege auf Par 4+4+3 = 11  ->  +1
    eq(toPar(r, "a"), 1, "Anna");
    // Ben: 8 Schlaege auf Par 4+3 = 7  ->  +1
    eq(toPar(r, "b"), 1, "Ben");
    eq(holesPlayed(r, "b"), 2, "Bens gespielte Bahnen");
  });

    <div class="card" style="padding:0; overflow:hidden">
      ${results.map(r => `<div class="test ${r.ok ? "pass" : "fail"}">
        <span class="mark">${r.ok ? "✓" : "✗"}</span>
        <span class="grow">${esc(r.name)}${r.detail ? `<code>${esc(r.detail)}</code>` : ""}</span>
      </div>`).join("")}
    </div>
    <p class="${failed ? "" : "muted"}" style="text-align:center; font-weight:700">
      ${failed ? failed + " FEHLGESCHLAGEN" : "Alles grün"}</p>
    <div class="stack"><a href="?" style="text-align:center">Zur App</a></div>
  </div>`;
  document.title = failed ? `Selbsttest: ${failed} fehlgeschlagen` : "Selbsttest: alles gruen";
  return failed;
}

/* =========================================================================
   Start
   ========================================================================= */

if (new URLSearchParams(location.search).has("selftest")){
  runSelfTest();
} else {
  const stored = loadState();
  state.rounds = stored.rounds;
  state.presets = stored.presets;
  state.settings = stored.settings;
  state.activeId = stored.activeId;
  applyTheme(state.settings.theme);
  const active = activeRound();
  /* Direkt zurueck in die laufende Runde: iOS entlaedt die Seite zwischen
     zwei Schlaegen regelmaessig, da will niemand jedes Mal neu navigieren. */
  if (active && !active.completedAt){
    state.hole = firstOpenHole(active);
    state.view = "play";
  }
  render();
}
</script>
</body>
</html>
