<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<title>Swing Golf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Golf-Scorecard fuer 18 Bahnen. Laeuft offline, speichert alles lokal auf dem Geraet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swing Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f7a4a">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='38' fill='%230b4a32'/><circle cx='58' cy='130' r='20' fill='%23f6f8f6'/><path d='M112 32v116' stroke='%23f6f8f6' stroke-width='10' stroke-linecap='round'/><path d='M112 38l46 19-46 19z' fill='%23e04141'/></svg>">
<style>
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f4f7f4; --sunken:#e6ebe6;
  --text:#132019; --muted:#5e6d64; --line:#d5ddd6;
  --accent:#0f7a4a; --accent-press:#0b5f39; --on-accent:#ffffff;
  --danger:#b3261e;
  --ace:#7b1fa2; --eagle:#7b1fa2; --birdie:#c62828; --par:#41504a;
  --bogey:#1f5fa8; --double:#0f3c6b;
  --radius:14px;
  --pad: max(14px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-right));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1512; --surface:#18211c; --surface-2:#1f2a24; --sunken:#121a16;
    --text:#e8efe9; --muted:#9baba2; --line:#2c3a32;
    --accent:#2ea36b; --accent-press:#248a5b; --on-accent:#06120c;
    --danger:#f2837c;
    --ace:#d38bef; --eagle:#d38bef; --birdie:#ff8a80; --par:#b6c4bb;
    --bogey:#7fb1ee; --double:#a9c9f2;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#18211c; --surface-2:#1f2a24; --sunken:#121a16;
  --text:#e8efe9; --muted:#9baba2; --line:#2c3a32;
  --accent:#2ea36b; --accent-press:#248a5b; --on-accent:#06120c;
  --danger:#f2837c;
  --ace:#d38bef; --eagle:#d38bef; --birdie:#ff8a80; --par:#b6c4bb;
  --bogey:#7fb1ee; --double:#a9c9f2;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  overscroll-behavior-y:contain;
}
button, input, select{font:inherit; color:inherit}
button{
  -webkit-appearance:none; appearance:none; border:1px solid var(--line);
  background:var(--surface); border-radius:var(--radius); padding:12px 14px;
  min-height:44px; cursor:pointer; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
button:active{background:var(--surface-2)}
button:disabled{opacity:.45; cursor:default}
button:focus-visible, input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
input[type=text], input[type=date]{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 12px; min-height:44px; width:100%; font-size:16px;
}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:640}
.btn-primary:active{background:var(--accent-press); border-color:var(--accent-press)}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger)}

#app{max-width:680px; margin:0 auto; padding:0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right))}
.screen{display:flex; flex-direction:column; min-height:100dvh; padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.topbar{
  display:flex; align-items:center; gap:10px; min-height:56px;
  padding-top:max(10px, env(safe-area-inset-top));
}
.topbar h1{font-size:19px; margin:0; flex:1; letter-spacing:.2px}
.topbar .sub{font-size:13px; color:var(--muted); font-weight:400; display:block}
.topbar button{padding:8px 12px; min-height:40px; font-size:14px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px}
.card h2{font-size:15px; margin:0 0 10px; letter-spacing:.3px; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex; flex-direction:column; gap:10px}
.row{display:flex; align-items:center; gap:10px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.grow{flex:1; min-width:0}
.truncate{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.empty{text-align:center; color:var(--muted); padding:28px 10px}

/* ---------- Startseite ---------- */
.round-item{width:100%; text-align:left; display:flex; align-items:center; gap:12px; padding:12px 14px}
.round-item .meta{flex:1; min-width:0}
.round-item .title{font-weight:640}
.round-item .score{font-variant-numeric:tabular-nums; font-weight:700; font-size:17px}
.badge{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.4px;
  padding:3px 8px; border-radius:999px; background:var(--accent); color:var(--on-accent)}

/* ---------- Setup ---------- */
.par-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:6px}
@media (min-width:480px){ .par-grid{grid-template-columns:repeat(9, 1fr)} }
.par-cell{display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 0; min-height:52px; background:var(--surface-2)}
.par-cell .hole{font-size:11px; color:var(--muted); line-height:1}
.par-cell .val{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}

/* ---------- Bahn-Eingabe ---------- */
.hole-head{text-align:center; padding:6px 0 14px}
.hole-head .no{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.hole-head .par{font-size:40px; font-weight:750; line-height:1.1; font-variant-numeric:tabular-nums}
.player-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 12px 14px; margin-bottom:10px}
.player-card .name{font-weight:640; display:flex; align-items:baseline; gap:8px}
.player-card .running{margin-left:auto; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.stepper{display:flex; align-items:center; gap:10px; margin-top:8px}
.stepper .step{flex:0 0 64px; height:58px; font-size:26px; font-weight:600; display:flex; align-items:center; justify-content:center}
.stepper .value{flex:1; text-align:center; min-width:0}
.stepper .value .n{font-size:34px; font-weight:750; line-height:1.05; font-variant-numeric:tabular-nums; display:block}
.stepper .value .lbl{font-size:12px; letter-spacing:.06em; text-transform:uppercase; display:block; min-height:15px}
.stepper .clear{flex:0 0 44px; height:44px; padding:0; font-size:17px; align-self:center; background:transparent; border-color:transparent; color:var(--muted)}
.s-ace{color:var(--ace)} .s-eagle{color:var(--eagle)} .s-birdie{color:var(--birdie)}
.s-par{color:var(--par)} .s-bogey{color:var(--bogey)} .s-double{color:var(--double)}
.s-none{color:var(--muted)}

.navbar{
  position:sticky; bottom:0; margin-top:auto; display:flex; gap:10px; align-items:center;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 72%, transparent);
}
.navbar button{flex:1}
.navbar .pos{flex:0 0 auto; font-variant-numeric:tabular-nums; font-weight:640; color:var(--muted); font-size:14px; padding:0 4px}

/* ---------- Scorekarte ---------- */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
table.card-table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
table.card-table th, table.card-table td{
  padding:7px 4px; text-align:center; font-size:14px; border-bottom:1px solid var(--line); min-width:30px;
}
table.card-table thead th{font-size:11px; color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--surface)}
table.card-table th.name-col, table.card-table td.name-col{
  text-align:left; position:sticky; left:0; background:var(--surface); z-index:1;
  min-width:74px; max-width:104px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  border-right:1px solid var(--line); padding-left:10px;
}
table.card-table tr.par-row td, table.card-table tr.par-row th{background:var(--sunken); color:var(--muted); font-size:13px}
table.card-table tr.par-row td.name-col, table.card-table tr.par-row th.name-col{background:var(--sunken)}
table.card-table td.sum{font-weight:700; background:var(--surface-2)}
table.card-table tr.par-row td.sum{background:var(--sunken)}
table.card-table td.empty-cell{color:var(--line)}
.par-editable{cursor:pointer}

/* ---------- Ergebnis ---------- */
.rank{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:none}
.rank .pos{flex:0 0 30px; font-size:19px; font-weight:750; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums}
.rank.win .pos{color:var(--accent)}
.rank .who{flex:1; min-width:0}
.rank .who .n{display:block}
.rank .who .small{display:block}
.rank .who .n{font-weight:640}
.rank .tot{text-align:right; font-variant-numeric:tabular-nums}
.rank .tot .strokes{font-size:21px; font-weight:750; display:block; line-height:1.1}
.rank .tot .rel{font-size:13px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px}
.chip{font-size:12px; padding:2px 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line)}

.notice{background:var(--surface-2); border:1px solid var(--line); border-left:4px solid var(--danger);
  border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:14px}

/* ---------- Vorschlaege, Schalter, Fusszeile ---------- */
.chips-row{display:flex; flex-wrap:wrap; gap:6px}
.chip-btn{font-size:14px; padding:8px 12px; min-height:38px; border-radius:999px; background:var(--surface-2)}
.chip-btn.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}
.preset{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:12px 14px}
.preset .title{font-weight:640; display:block}
.preset.on{border-color:var(--accent); background:var(--surface-2)}
.preset .tick{flex:0 0 auto; color:var(--accent); font-weight:800; font-size:18px}
.switch{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px}
.switch .box{flex:0 0 26px; height:26px; border:2px solid var(--line); border-radius:7px;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px}
.switch[aria-pressed="true"] .box{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.switch .lbl{flex:1; min-width:0}
.switch .lbl b{display:block}
.switch .lbl span{display:block; font-size:13px; color:var(--muted)}
.si-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px}
@media (min-width:480px){ .si-grid{grid-template-columns:repeat(6, 1fr)} }
.si-cell{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.si-cell select{flex:1; min-width:0; min-height:40px; padding:6px 4px; font-size:15px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:9px; color:var(--text)}
.footer-nav{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
.footer-nav button{flex:1 1 auto; font-size:14px; min-height:42px; background:transparent}

/* ---------- Statistik ---------- */
.stat-name{text-transform:none; font-size:17px; color:var(--text)}
.stat-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin:10px 0}
.stat{background:var(--surface-2); border-radius:11px; padding:10px 12px}
.stat .v{font-size:21px; font-weight:750; font-variant-numeric:tabular-nums; line-height:1.15}
.stat .k{font-size:12px; color:var(--muted)}
.bars{display:flex; flex-direction:column; gap:5px; margin-top:8px}
.bar{display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:8px; font-size:13px}
.bar .track{height:9px; background:var(--sunken); border-radius:999px; overflow:hidden}
.bar .fill{height:100%; border-radius:999px; background:var(--accent)}
.bar .n{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}

/* ---------- Impressum ---------- */
.legal{font-size:15px; line-height:1.55}
.legal h3{font-size:14px; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); margin:16px 0 4px}
.legal h3:first-child{margin-top:0}
.legal p{margin:0 0 4px}
.todo{background:color-mix(in srgb, var(--danger) 12%, transparent);
  border:1px dashed var(--danger); border-radius:6px; padding:1px 7px; font-weight:640}

/* ---------- Selbsttest ---------- */
.test{padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; display:flex; gap:10px}
.test .mark{flex:0 0 20px; font-weight:700}
.test.pass .mark{color:var(--accent)} .test.fail .mark{color:var(--danger)}
.test.fail{background:color-mix(in srgb, var(--danger) 10%, transparent)}
.test code{font-size:12px; color:var(--muted); display:block; word-break:break-word}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
"use strict";

/* =========================================================================
   Modell und reine Rechenfunktionen
   -------------------------------------------------------------------------
   Alles hier ist frei von DOM und localStorage, damit der Selbsttest
   (?selftest=1) es direkt pruefen kann.
   ========================================================================= */

const DEFAULT_HOLES = 18;
const MIN_HOLES = 1;
const MAX_HOLES = 36;
const MIN_STROKES = 1;
const MAX_STROKES = 20;
const MIN_PAR = 3;
const MAX_PAR = 6;
const MAX_PLAYERS = 6;
const MAX_HCP = 54;
// Muster einer 18-Loch-Runde, Summe 72. Fuer andere Bahnenzahlen wird es
// zyklisch fortgesetzt -- irgendeine Vorlage braucht es, und diese ist die
// vertrauteste.
const PAR_PATTERN = [4,4,3,5,4,4,3,4,5, 4,3,4,5,4,4,3,4,5];

function defaultPars(holes){
  return Array.from({ length: holes }, (_, i) => PAR_PATTERN[i % PAR_PATTERN.length]);
}

// Stroke-Index: welche Bahn den wievielten Vorschlag bekommt. Ohne die Angaben
// der Scorekarte ist die Reihenfolge der Bahnen die einzige ehrliche Vorgabe.
function defaultSi(holes){
  return Array.from({ length: holes }, (_, i) => i + 1);
}

/* Die Bahnenzahl steht nicht im Modell, sie ist die Laenge von pars. Ein
   zweites Feld koennte davon abweichen, diese Ableitung nicht. */
function holeCount(round){
  return round.pars.length;
}

/* Out/In nur, wenn sich die Runde sauber halbieren laesst: bei 18 die
   ueblichen 9+9, bei 12 sechs und sechs. Bei 9 Bahnen gibt es keine
   sinnvolle Haelfte -- dann steht nur die Gesamtsumme. 0 heisst "nicht
   teilen". */
function halfPoint(holes){
  return (holes >= 6 && holes % 2 === 0) ? holes / 2 : 0;
}

/* Bringt einen Stroke-Index auf n Bahnen: vorhandene gueltige Werte bleiben
   an ihrer Bahn, alles andere wird mit den fehlenden Zahlen aufgefuellt.
   Ergebnis ist immer eine Permutation von 1..n. */
function resizeSi(si, n){
  const out = new Array(n);
  const used = new Set();
  for (let i = 0; i < n; i++){
    const v = Math.round(Number((si || [])[i]));
    if (v >= 1 && v <= n && !used.has(v)){ out[i] = v; used.add(v); }
  }
  const free = [];
  for (let v = 1; v <= n; v++) if (!used.has(v)) free.push(v);
  for (let i = 0; i < n; i++) if (out[i] == null) out[i] = free.shift();
  return out;
}

/* Das haeufigste Par der bisherigen Bahnen sagt mehr als eine allgemeine
   Vorlage: wer auf einem Platz mit zwoelfmal Par 3 eine Bahn ergaenzt, will
   dort keine Par 5. Gleichstand entscheidet das kleinere Par. */
function commonPar(pars){
  if (!pars.length) return PAR_PATTERN[0];
  const count = new Map();
  for (const v of pars) count.set(v, (count.get(v) || 0) + 1);
  let best = null, bestN = 0;
  for (const [v, n] of count){
    if (n > bestN || (n === bestN && v < best)){ best = v; bestN = n; }
  }
  return best;
}

/* Bahnenzahl einer noch nicht gestarteten Runde aendern. Bereits gesetzte
   Bahnen behalten ihr Par, neue bekommen das haeufigste Par der Runde. */
function resizeDraft(draft, holes){
  const raw = Math.round(Number(holes));
  const n = clamp(Number.isFinite(raw) ? raw : DEFAULT_HOLES, MIN_HOLES, MAX_HOLES);
  const fuellwert = commonPar(draft.pars);
  draft.pars = Array.from({ length: n }, (_, i) =>
    draft.pars[i] != null ? draft.pars[i] : fuellwert);
  draft.si = resizeSi(draft.si, n);
  return draft;
}

function uid(){
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function makePlayer(name, hcp){
  return { id: uid(), name: name || "", hcp: clamp(Math.round(hcp || 0), 0, MAX_HCP) };
}

function makeRound(courseName, date, players, pars, opts){
  const o = opts || {};
  const round = {
    id: uid(),
    courseName: courseName || "",
    date: date || todayISO(),
    pars: (pars && pars.length ? pars : defaultPars(DEFAULT_HOLES)).slice(0, MAX_HOLES),
    si: [],
    stableford: !!o.stableford,
    players: players.map(p => ({
      id: p.id || uid(),
      name: p.name,
      hcp: clamp(Math.round(p.hcp || 0), 0, MAX_HCP)
    })),
    strokes: {},
    completedAt: null
  };
  round.si = resizeSi(o.si, round.pars.length);
  for (const p of round.players) round.strokes[p.id] = new Array(round.pars.length).fill(null);
  return round;
}

/* Gleicht eine geladene Runde an das erwartete Format an: fehlende Bahnen
   auffuellen, zu lange Arrays kappen, Muell zu null machen. Laeuft ueber
   alles, was aus dem localStorage kommt -- da steht potentiell eine aeltere
   Version der App drin. */
function normalizeRound(raw){
  if (!raw || typeof raw !== "object") return null;

  /* Die Bahnenzahl kommt aus den gespeicherten Daten, nicht aus einer
     Konstanten -- sonst wuerde eine 9-Loch-Runde beim Laden auf 18
     aufgeblasen. */
  const rawPars = Array.isArray(raw.pars) ? raw.pars : [];
  const holes = clamp(rawPars.length || DEFAULT_HOLES, MIN_HOLES, MAX_HOLES);
  const fallback = defaultPars(holes);

  const pars = new Array(holes);
  for (let i = 0; i < holes; i++){
    const v = Number(rawPars[i]);
    pars[i] = Number.isFinite(v) && v > 0 ? clamp(Math.round(v), MIN_PAR, MAX_PAR) : fallback[i];
  }

  /* Stroke-Index: jede Zahl 1..18 genau einmal. Alles andere (fehlend, doppelt,
     Unsinn) faellt auf die Vorgabe zurueck -- ein halb kaputter Index verteilt
     Vorschlaege falsch, und das faellt niemandem auf. */
  let si = Array.isArray(raw.si) ? raw.si.map(v => Math.round(Number(v))) : [];
  const seen = new Set(si);
  if (si.length !== holes || seen.size !== holes || si.some(v => !(v >= 1 && v <= holes))){
    si = defaultSi(holes);
  }

  const players = Array.isArray(raw.players)
    ? raw.players.filter(p => p && p.id).map(p => ({
        id: String(p.id),
        name: String(p.name || ""),
        hcp: Number.isFinite(Number(p.hcp)) ? clamp(Math.round(Number(p.hcp)), 0, MAX_HCP) : 0
      }))
    : [];
  if (!players.length) return null;

  const strokes = {};
  for (const p of players){
    const src = raw.strokes && Array.isArray(raw.strokes[p.id]) ? raw.strokes[p.id] : [];
    const out = new Array(holes);
    for (let i = 0; i < holes; i++){
      const v = Number(src[i]);
      out[i] = Number.isFinite(v) && v > 0 ? clamp(Math.round(v), MIN_STROKES, MAX_STROKES) : null;
    }
    strokes[p.id] = out;
  }

  return {
    id: String(raw.id || uid()),
    courseName: String(raw.courseName || ""),
    date: String(raw.date || todayISO()),
    pars, si,
    stableford: !!raw.stableford,
    players, strokes,
    completedAt: raw.completedAt ? String(raw.completedAt) : null
  };
}

function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }

/* Erster Tipp auf "+" setzt direkt auf Par -- das ist der haeufigste Wert
   und spart auf der Bahn drei bis vier Tipper. */
function bumpStroke(current, par, delta){
  if (current == null) return clamp(delta > 0 ? par : par - 1, MIN_STROKES, MAX_STROKES);
  return clamp(current + delta, MIN_STROKES, MAX_STROKES);
}

function holesPlayed(round, playerId){
  return (round.strokes[playerId] || []).filter(v => v != null).length;
}

function totalStrokes(round, playerId, from = 0, to = holeCount(round)){
  let sum = 0;
  const s = round.strokes[playerId] || [];
  for (let i = from; i < to; i++) if (s[i] != null) sum += s[i];
  return sum;
}

/* Par nur der tatsaechlich gespielten Bahnen -- sonst steht man nach Bahn 1
   mit -68 da. */
function playedPar(round, playerId, from = 0, to = holeCount(round)){
  let sum = 0;
  const s = round.strokes[playerId] || [];
  for (let i = from; i < to; i++) if (s[i] != null) sum += round.pars[i];
  return sum;
}

function toPar(round, playerId, from = 0, to = holeCount(round)){
  return totalStrokes(round, playerId, from, to) - playedPar(round, playerId, from, to);
}

function scoreLabel(strokes, par){
  if (strokes == null) return { key: "none", label: "", cls: "s-none" };
  if (strokes === 1) return { key: "ace", label: "Hole-in-One", cls: "s-ace" };
  const d = strokes - par;
  if (d <= -3) return { key: "eagle", label: "Albatros", cls: "s-eagle" };
  if (d === -2) return { key: "eagle", label: "Eagle", cls: "s-eagle" };
  if (d === -1) return { key: "birdie", label: "Birdie", cls: "s-birdie" };
  if (d === 0)  return { key: "par", label: "Par", cls: "s-par" };
  if (d === 1)  return { key: "bogey", label: "Bogey", cls: "s-bogey" };
  if (d === 2)  return { key: "double", label: "Doppelbogey", cls: "s-double" };
  return { key: "double", label: "+" + d, cls: "s-double" };
}

function scoreCounts(round, playerId){
  const counts = { ace: 0, eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };
  const s = round.strokes[playerId] || [];
  for (let i = 0; i < holeCount(round); i++){
    if (s[i] == null) continue;
    counts[scoreLabel(s[i], round.pars[i]).key]++;
  }
  return counts;
}

/* Vorschlaege nach Spielvorgabe: erst jede Bahn einmal, der Rest nach
   Stroke-Index. Bei Vorgabe 0 kommt 0 heraus, dann ist Stableford brutto. */
function strokesReceived(hcp, si, holeIdx){
  const holes = si.length;
  const h = clamp(Math.round(hcp || 0), 0, MAX_HCP);
  return Math.floor(h / holes) + (si[holeIdx] <= (h % holes) ? 1 : 0);
}

function stablefordPoints(strokes, par, received){
  if (strokes == null) return null;
  return Math.max(0, 2 - ((strokes - received) - par));
}

function holePoints(round, playerId, i){
  const player = round.players.find(p => p.id === playerId);
  if (!player) return null;
  return stablefordPoints(
    round.strokes[playerId][i], round.pars[i],
    strokesReceived(player.hcp, round.si, i)
  );
}

function totalPoints(round, playerId, from = 0, to = holeCount(round)){
  let sum = 0;
  for (let i = from; i < to; i++){
    const p = holePoints(round, playerId, i);
    if (p != null) sum += p;
  }
  return sum;
}

function leaderboard(round){
  return round.players
    .map(p => ({
      id: p.id,
      name: p.name,
      hcp: p.hcp,
      strokes: totalStrokes(round, p.id),
      toPar: toPar(round, p.id),
      points: totalPoints(round, p.id),
      played: holesPlayed(round, p.id)
    }))
    .sort((a, b) =>
      (round.stableford ? b.points - a.points : a.toPar - b.toPar) ||
      a.strokes - b.strokes ||
      b.played - a.played ||
      a.name.localeCompare(b.name, "de")
    );
}

function roundProgress(round){
  return Math.max(0, ...round.players.map(p => holesPlayed(round, p.id)));
}

function isRoundEmpty(round){
  return roundProgress(round) === 0;
}

function fmtToPar(n){
  if (n === 0) return "E";
  return (n > 0 ? "+" : "-") + Math.abs(n);
}

function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? m[3] + "." + m[2] + "." + m[1] : (iso || "");
}

/* =========================================================================
   Statistik, Vorschlaege, Teilen, Export
   ========================================================================= */

const EMPTY_COUNTS = { ace: 0, eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };

/* Fasst ueber alle abgeschlossenen Runden zusammen, gebuendelt nach
   Spielernamen -- Spieler-IDs sind pro Runde neu, der Name ist die einzige
   Klammer ueber mehrere Runden hinweg. */
function statsFor(rounds){
  const byName = new Map();

  for (const r of rounds){
    if (!r.completedAt) continue;
    for (const p of r.players){
      const played = holesPlayed(r, p.id);
      if (!played) continue;

      const e = byName.get(p.name) || {
        name: p.name, rounds: 0, fullRounds: 0, holes: 0, strokes: 0, par: 0,
        best: null, counts: Object.assign({}, EMPTY_COUNTS),
        byPar: { 3: { holes: 0, strokes: 0 }, 4: { holes: 0, strokes: 0 },
                 5: { holes: 0, strokes: 0 }, 6: { holes: 0, strokes: 0 } }
      };

      e.rounds++;
      e.holes += played;
      e.strokes += totalStrokes(r, p.id);
      e.par += playedPar(r, p.id);

      const counts = scoreCounts(r, p.id);
      for (const k in counts) e.counts[k] += counts[k];

      const s = r.strokes[p.id];
      for (let i = 0; i < holeCount(r); i++){
        if (s[i] == null) continue;
        const bucket = e.byPar[r.pars[i]];
        if (bucket){ bucket.holes++; bucket.strokes += s[i]; }
      }

      // Nur vollstaendige Runden sind untereinander vergleichbar.
      if (played === holeCount(r)){
        e.fullRounds++;
        const tot = totalStrokes(r, p.id);
        if (!e.best || tot < e.best.strokes){
          e.best = { strokes: tot, toPar: toPar(r, p.id), course: r.courseName, date: r.date };
        }
      }

      byName.set(p.name, e);
    }
  }

  return [...byName.values()]
    .sort((a, b) => b.rounds - a.rounds || a.name.localeCompare(b.name, "de"));
}

/* Zuletzt benutzte Namen und Plaetze, neueste zuerst. */
function recentPlayers(rounds){
  const seen = new Map();
  for (let i = rounds.length - 1; i >= 0; i--){
    for (const p of rounds[i].players){
      const name = p.name.trim();
      if (name && !seen.has(name)) seen.set(name, { name, hcp: p.hcp });
    }
  }
  return [...seen.values()];
}

/* Mitgelieferte Vorlagen. Eine Runde faengt mit einer Form an, nicht mit 18
   leeren Feldern -- welche Form, ist die erste Frage auf dem Platz. */
const BUILTIN_PRESETS = [
  { name: "Golfplatz, 18 Loch", pars: defaultPars(18) },
  { name: "Golfplatz, 9 Loch",  pars: defaultPars(9) },
  { name: "Swingolf, 12 Bahnen", pars: new Array(12).fill(3) },
  { name: "Swingolf, 9 Bahnen",  pars: new Array(9).fill(3) }
];

/* Vorlagen zur Auswahl: erst die gespielten Plaetze (neueste zuerst), dann
   die mitgelieferten Formen. Ein Platz, den es schon gibt, ist die bessere
   Vorlage als eine allgemeine Form. */
function presetList(rounds){
  const saved = recentCourses(rounds).map(c => ({
    name: c.name, pars: c.pars, si: c.si, saved: true
  }));
  const builtin = BUILTIN_PRESETS.map(b => ({
    name: b.name, pars: b.pars.slice(), si: defaultSi(b.pars.length), saved: false
  }));
  return saved.concat(builtin);
}

function recentCourses(rounds){
  const seen = new Map();
  for (let i = rounds.length - 1; i >= 0; i--){
    const r = rounds[i];
    const name = r.courseName.trim();
    if (name && !seen.has(name)){
      seen.set(name, { name, pars: r.pars.slice(), si: r.si.slice() });
    }
  }
  return [...seen.values()];
}

function shareText(round){
  const board = leaderboard(round);
  const lines = [`${round.courseName || "Runde"} \u00b7 ${fmtDate(round.date)}`];
  board.forEach((e, i) => {
    lines.push(round.stableford
      ? `${i + 1}. ${e.name} \u2014 ${e.points} Punkte (${e.strokes} Schl\u00e4ge)`
      : `${i + 1}. ${e.name} \u2014 ${e.strokes} Schl\u00e4ge (${fmtToPar(e.toPar)})`);
  });
  lines.push(`Par ${sum(round.pars, 0, holeCount(round))}, ${holeCount(round)} Bahnen`);
  return lines.join("\n");
}

/* Fuehrt importierte Runden mit den vorhandenen zusammen. Gleiche id heisst
   gleiche Runde -- lieber ueberspringen als doppelt in der Historie. */
function mergeRounds(existing, incoming){
  const known = new Set(existing.map(r => r.id));
  const added = [];
  for (const raw of incoming){
    const r = normalizeRound(raw);
    if (r && !known.has(r.id)){ known.add(r.id); added.push(r); }
  }
  return { rounds: existing.concat(added), added: added.length,
           skipped: incoming.length - added.length };
}

/* =========================================================================
   Speicherung
   ========================================================================= */

const STORAGE_KEY = "swing-golf:v1";

function serialize(state){
  return JSON.stringify({
    version: 1,
    rounds: state.rounds,
    activeId: state.activeId
  });
}

function deserialize(raw){
  const empty = { rounds: [], activeId: null };
  if (!raw) return empty;
  let data;
  try { data = JSON.parse(raw); } catch { return empty; }
  if (!data || !Array.isArray(data.rounds)) return empty;
  const rounds = data.rounds.map(normalizeRound).filter(Boolean);
  const activeId = rounds.some(r => r.id === data.activeId) ? data.activeId : null;
  return { rounds, activeId };
}

function loadState(){
  try { return deserialize(localStorage.getItem(STORAGE_KEY)); }
  catch { return { rounds: [], activeId: null }; }
}

/* Gibt false zurueck, wenn nicht geschrieben werden konnte (privater Modus,
   volles Kontingent). Die App laeuft dann weiter, nur ohne Historie. */
function saveState(state){
  try { localStorage.setItem(STORAGE_KEY, serialize(state)); return true; }
  catch { return false; }
}

/* =========================================================================
   App-Zustand
   ========================================================================= */

const state = {
  view: "home",        // home | setup | play | summary
  rounds: [],
  activeId: null,
  draft: null,         // Runde im Aufbau (noch nicht in rounds)
  hole: 0,             // 0-basierter Bahnindex
  table: false,        // Scorekarte statt Bahn-Eingabe
  dataMsg: "",         // Rueckmeldung nach Export/Import
  storageFailed: false
};

const root = document.getElementById("app");

function activeRound(){
  return state.rounds.find(r => r.id === state.activeId) || null;
}

function persist(){
  const ok = saveState(state);
  state.storageFailed = !ok;
}

function firstOpenHole(round){
  const n = holeCount(round);
  for (let i = 0; i < n; i++){
    if (round.players.some(p => round.strokes[p.id][i] == null)) return i;
  }
  return n - 1;
}

/* =========================================================================
   Rendering
   ========================================================================= */

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render(){
  let html = "";
  if (state.storageFailed){
    html += `<div class="notice">Diese Runde kann nicht gespeichert werden &ndash; der Browser
      verweigert den Speicher (privater Modus?). Eintragen funktioniert, aber nach dem Schlie&szlig;en
      ist die Runde weg.</div>`;
  }
  if (state.view === "setup") html += viewSetup();
  else if (state.view === "play") html += viewPlay();
  else if (state.view === "summary") html += viewSummary();
  else if (state.view === "stats") html += viewStats();
  else if (state.view === "data") html += viewData();
  else if (state.view === "impressum") html += viewImpressum();
  else html += viewHome();
  root.innerHTML = html;
}

function topbar(title, sub, leftBtn, rightBtn){
  return `<div class="topbar">
    ${leftBtn || ""}
    <h1>${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</h1>
    ${rightBtn || ""}
  </div>`;
}

/* ---------- Startseite ---------- */

function viewHome(){
  const running = state.rounds.filter(r => !r.completedAt);
  const done = state.rounds.filter(r => r.completedAt);
  const sortByDate = (a, b) => (b.date || "").localeCompare(a.date || "");
  running.sort(sortByDate);
  done.sort(sortByDate);

  let html = `<div class="screen">` + topbar("Swing Golf", "18 Bahnen, lokal gespeichert");

  html += `<button class="btn-primary" data-act="new" style="width:100%; margin-bottom:16px">
    Neue Runde starten</button>`;

  if (running.length){
    html += `<div class="card"><h2>Laufend</h2><div class="stack">`;
    for (const r of running) html += roundItem(r, true);
    html += `</div></div>`;
  }

  html += `<div class="card"><h2>Gespielte Runden</h2>`;
  if (!done.length){
    html += `<div class="empty">Noch keine Runde abgeschlossen.</div>`;
  } else {
    html += `<div class="stack">`;
    for (const r of done) html += roundItem(r, false);
    html += `</div>`;
  }
  html += `</div>`;

  html += `<div class="footer-nav">
    <button data-act="stats">Statistik</button>
    <button data-act="data">Daten</button>
    <button data-act="impressum">Impressum</button>
  </div>`;
  html += `<p class="small muted" style="padding:8px 4px 0">
    Alle Runden liegen nur auf diesem Ger&auml;t &ndash; nichts wird hochgeladen.</p>`;
  return html + `</div>`;
}

function roundItem(round, isRunning){
  const board = leaderboard(round);
  const top = board[0];
  const played = roundProgress(round);
  const title = round.courseName || "Ohne Platznamen";
  const sub = isRunning
    ? `${fmtDate(round.date)} &middot; Bahn ${Math.min(played + 1, holeCount(round))} von ${holeCount(round)}`
    : `${fmtDate(round.date)} &middot; ${top ? esc(top.name) + " gewinnt" : ""}`;

  return `<div class="row" style="gap:6px">
    <button class="round-item grow" data-act="open" data-id="${round.id}">
      <span class="meta">
        <span class="title truncate">${esc(title)}</span>
        <span class="small muted truncate" style="display:block">${sub}</span>
      </span>
      ${top && played ? `<span class="score">${top.strokes} <span class="muted small">(${fmtToPar(top.toPar)})</span></span>` : ""}
      ${isRunning ? `<span class="badge">weiter</span>` : ""}
    </button>
    <button class="btn-ghost btn-danger" data-act="del" data-id="${round.id}"
      aria-label="Runde l&ouml;schen" style="flex:0 0 46px; padding:0">&#10005;</button>
  </div>`;
}

/* ---------- Setup ---------- */

function viewSetup(){
  const d = state.draft;
  const n = d.pars.length;
  const parTotal = d.pars.reduce((a, b) => a + b, 0);
  const presets = presetList(state.rounds);
  const taken = new Set(d.players.map(p => p.name.trim()).filter(Boolean));
  const people = recentPlayers(state.rounds).filter(p => !taken.has(p.name));

  let html = `<div class="screen">` + topbar("Neue Runde", null,
    `<button class="btn-ghost" data-act="home">Zur&uuml;ck</button>`);

  /* Mehrere Vorlagen koennen dieselbe Form haben (ein gespielter 18-Loch-Platz
     und "Golfplatz, 18 Loch"). Dann bekommt nur die erste den Haken, sonst
     sieht es aus, als waeren zwei gewaehlt. Die Markierung haengt an den
     Werten, nicht an einem gemerkten Namen -- wer danach das Par aendert,
     verliert sie automatisch. */
  const passt = pre => pre.pars.length === n && pre.pars.every((v, k) => v === d.pars[k]);
  const aktivIdx = presets.findIndex(passt);

  html += `<div class="card"><h2>Vorlage</h2><div class="stack">`;
  presets.slice(0, 8).forEach((pre, i) => {
    const total = pre.pars.reduce((a, b) => a + b, 0);
    const aktiv = i === aktivIdx;
    html += `<button class="preset${aktiv ? " on" : ""}" data-act="use-preset" data-i="${i}">
      <span class="grow">
        <span class="title truncate">${esc(pre.name)}</span>
        <span class="small muted">${pre.pars.length} Bahnen &middot; Par ${total}${
          pre.saved ? " &middot; gespielt" : ""}</span>
      </span>
      ${aktiv ? `<span class="tick" aria-label="gew&auml;hlt">&#10003;</span>` : ""}
    </button>`;
  });
  html += `</div><p class="small muted" style="margin:10px 0 0">Alles darunter
    l&auml;sst sich danach noch einzeln &auml;ndern.</p></div>`;

  html += `<div class="card"><h2>Platz</h2><div class="stack">
    <input type="text" data-field="courseName" value="${esc(d.courseName)}"
      placeholder="Platzname" autocomplete="off" enterkeyhint="done">
    <input type="date" data-field="date" value="${esc(d.date)}">
  </div></div>`;

  html += `<div class="card"><h2>Spieler</h2><div class="stack">`;
  d.players.forEach((p, i) => {
    html += `<div class="row">
      <input class="grow" type="text" data-field="player" data-id="${p.id}"
        value="${esc(p.name)}" placeholder="Spieler ${i + 1}" autocomplete="off" enterkeyhint="done">
      <input type="number" data-field="hcp" data-id="${p.id}" value="${p.hcp}"
        min="0" max="${MAX_HCP}" step="1" aria-label="Spielvorgabe f&uuml;r Spieler ${i + 1}"
        style="flex:0 0 76px; text-align:center">
      <button class="btn-ghost btn-danger" data-act="rm-player" data-id="${p.id}"
        aria-label="Spieler entfernen" style="flex:0 0 46px; padding:0"
        ${d.players.length <= 1 ? "disabled" : ""}>&#10005;</button>
    </div>`;
  });
  html += `<p class="small muted" style="margin:0">Das schmale Feld ist die Spielvorgabe
    (0 = ohne). Sie z&auml;hlt nur f&uuml;r Stableford.</p>`;
  if (people.length){
    html += `<div class="chips-row">` + people.slice(0, 8).map((p, i) =>
      `<button class="chip-btn" data-act="use-player" data-i="${i}">+ ${esc(p.name)}</button>`
    ).join("") + `</div>`;
  }
  if (d.players.length < MAX_PLAYERS){
    html += `<button data-act="add-player">+ Spieler hinzuf&uuml;gen</button>`;
  } else {
    html += `<p class="small muted" style="margin:0">Maximal ${MAX_PLAYERS} Spieler.</p>`;
  }
  html += `</div></div>`;

  html += `<div class="card" style="padding:0; overflow:hidden">
    <button class="switch" data-act="toggle-stableford" aria-pressed="${d.stableford}"
      style="border:none; border-radius:0">
      <span class="box" aria-hidden="true">${d.stableford ? "&#10003;" : ""}</span>
      <span class="lbl"><b>Stableford z&auml;hlen</b>
        <span>Punkte statt Schl&auml;ge, netto nach Spielvorgabe</span></span>
    </button>
  </div>`;

  html += `<div class="card">
    <h2>Bahnen</h2>
    <div class="stepper" style="margin:0 0 10px">
      <button class="step" data-act="holes" data-delta="-1"
        aria-label="Eine Bahn weniger" ${n <= MIN_HOLES ? "disabled" : ""}>&minus;</button>
      <div class="value"><span class="n">${n}</span>
        <span class="lbl">Bahnen</span></div>
      <button class="step" data-act="holes" data-delta="1"
        aria-label="Eine Bahn mehr" ${n >= MAX_HOLES ? "disabled" : ""}>+</button>
    </div>
    <div class="chips-row">` +
      [6, 9, 12, 18].map(v =>
        `<button class="chip-btn${v === n ? " on" : ""}" data-act="holes-set" data-n="${v}">${v}</button>`
      ).join("") + `</div>
    <p class="small muted" style="margin:8px 0 0">${MIN_HOLES} bis ${MAX_HOLES} Bahnen.
      Vorhandene Bahnen behalten ihr Par, neue bekommen das h&auml;ufigste Par
      dieser Runde.</p>
  </div>`;

  html += `<div class="card">
    <div class="spread" style="margin-bottom:10px">
      <h2 style="margin:0">Par je Bahn</h2>
      <span class="small muted">Gesamt ${parTotal}</span>
    </div>
    <div class="par-grid">`;
  d.pars.forEach((par, i) => {
    html += `<button class="par-cell" data-act="cycle-par" data-hole="${i}"
      aria-label="Bahn ${i + 1}, Par ${par}, tippen zum &Auml;ndern">
      <span class="hole">${i + 1}</span><span class="val">${par}</span></button>`;
  });
  html += `</div>
    <div class="row" style="margin-top:10px">
      <button class="btn-ghost small grow" data-act="reset-par">Par auf Golf-Standard (4-4-3-5-&hellip;)</button>
    </div>
    <p class="small muted" style="margin:8px 0 0">Tippen schaltet ${MIN_PAR}&rarr;${MAX_PAR}&rarr;${MIN_PAR} weiter.</p>
  </div>`;

  if (d.stableford){
    const valid = new Set(d.si).size === n;
    html += `<div class="card">
      <h2>Stroke-Index</h2>
      <p class="small muted" style="margin:-4px 0 10px">Welche Bahn den wievielten
        Vorschlag bekommt &ndash; steht auf der Scorekarte des Platzes. Jede Zahl
        von 1 bis ${n} genau einmal.</p>
      <div class="si-grid">`;
    d.si.forEach((v, i) => {
      html += `<label class="si-cell">${i + 1}
        <select data-field="si" data-hole="${i}" aria-label="Stroke-Index Bahn ${i + 1}">` +
        defaultSi(n).map(k => `<option value="${k}"${k === v ? " selected" : ""}>${k}</option>`).join("") +
        `</select></label>`;
    });
    html += `</div>`;
    if (!valid){
      html += `<p class="small" style="color:var(--danger); margin:10px 0 0">
        Jede Zahl darf nur einmal vorkommen &ndash; sonst wird beim Start die
        Bahnreihenfolge verwendet.</p>`;
    }
    html += `<div class="row" style="margin-top:10px">
      <button class="btn-ghost small grow" data-act="reset-si">Bahnreihenfolge wiederherstellen</button>
    </div></div>`;
  }

  html += `<button class="btn-primary" data-act="start" style="width:100%">Runde starten</button>`;
  return html + `</div>`;
}

/* ---------- Bahn-Eingabe und Scorekarte ---------- */

function viewPlay(){
  const round = activeRound();
  if (!round){ state.view = "home"; return viewHome(); }
  return state.table ? playTable(round) : playHole(round);
}

function playHole(round){
  const i = state.hole;
  const par = round.pars[i];

  let html = `<div class="screen">` + topbar(
    round.courseName || "Runde", fmtDate(round.date),
    `<button class="btn-ghost" data-act="home">Pause</button>`,
    `<button class="btn-ghost" data-act="toggle-table">Karte</button>`);

  html += `<div class="hole-head">
    <div class="no">Bahn ${i + 1} von ${holeCount(round)}</div>
    <div class="par">Par ${par}</div>
  </div>`;

  for (const p of round.players){
    const v = round.strokes[p.id][i];
    const lbl = scoreLabel(v, par);
    const recv = round.stableford ? strokesReceived(p.hcp, round.si, i) : 0;
    const pts = round.stableford ? holePoints(round, p.id, i) : null;
    const running = round.stableford
      ? `${totalPoints(round, p.id)} Pkt`
      : fmtToPar(toPar(round, p.id));
    html += `<div class="player-card">
      <div class="name"><span class="truncate">${esc(p.name)}</span>
        ${recv ? `<span class="small muted">+${recv}</span>` : ""}
        <span class="running">Runde ${running}</span></div>
      <div class="stepper">
        <button class="step" data-act="stroke" data-id="${p.id}" data-delta="-1"
          aria-label="Ein Schlag weniger f&uuml;r ${esc(p.name)}">&minus;</button>
        <div class="value">
          <span class="n ${lbl.cls}">${v == null ? "&ndash;" : v}</span>
          <span class="lbl ${lbl.cls}">${lbl.label}${
            pts != null ? ` &middot; ${pts} Pkt` : ""}</span>
        </div>
        <button class="step" data-act="stroke" data-id="${p.id}" data-delta="1"
          aria-label="Ein Schlag mehr f&uuml;r ${esc(p.name)}">+</button>
        <button class="clear" data-act="clear-stroke" data-id="${p.id}"
          aria-label="Eintrag f&uuml;r ${esc(p.name)} l&ouml;schen"
          ${v == null ? "disabled" : ""}>&#8635;</button>
      </div>
    </div>`;
  }

  const last = i === holeCount(round) - 1;
  html += `<div class="navbar">
    <button data-act="prev-hole" ${i === 0 ? "disabled" : ""}>&larr; Bahn</button>
    <span class="pos">${i + 1}/${holeCount(round)}</span>
    ${last
      ? `<button class="btn-primary" data-act="finish">Runde beenden</button>`
      : `<button data-act="next-hole">Bahn &rarr;</button>`}
  </div>`;
  return html + `</div>`;
}

function playTable(round){
  const cols = tableColumns(round);

  let html = `<div class="screen">` + topbar(
    round.courseName || "Runde", "Scorekarte",
    `<button class="btn-ghost" data-act="home">Pause</button>`,
    `<button class="btn-ghost" data-act="toggle-table">${round.completedAt ? "Ergebnis" : "Bahn"}</button>`);

  const head = cols.map(c => c.sum
    ? `<th>${c.label}</th>`
    : `<th>${c.hole + 1}</th>`).join("");

  const parCells = cols.map(c => c.sum
    ? `<td class="sum">${sum(round.pars, c.sum[0], c.sum[1])}</td>`
    : parCell(round, c.hole)).join("");

  let body = "";
  for (const p of round.players){
    const s = round.strokes[p.id];
    const cells = cols.map(c => c.sum
      ? `<td class="sum">${totalStrokes(round, p.id, c.sum[0], c.sum[1]) || "&middot;"}</td>`
      : strokeCell(s[c.hole], round.pars[c.hole])).join("");
    body += `<tr><th class="name-col" scope="row">${esc(p.name)}</th>${cells}</tr>`;
  }

  html += `<div class="table-wrap"><table class="card-table">
    <thead><tr><th class="name-col">Bahn</th>${head}</tr></thead>
    <tbody>
      <tr class="par-row"><th class="name-col" scope="row">Par</th>${parCells}</tr>
      ${body}
    </tbody></table></div>`;

  html += `<div class="card" style="margin-top:12px"><div class="stack">`;
  for (const e of leaderboard(round)){
    html += `<div class="spread"><span class="truncate">${esc(e.name)}</span>
      <span style="font-variant-numeric:tabular-nums">${
        round.stableford
          ? `<strong>${e.points}</strong> <span class="muted small">Pkt &middot; ${e.strokes || 0} Schl&auml;ge</span>`
          : `<strong>${e.strokes || 0}</strong> <span class="muted small">${e.played ? fmtToPar(e.toPar) : "&ndash;"}</span>`
      }</span></div>`;
  }
  html += `</div></div>`;
  html += `<p class="small muted" style="padding:0 4px">Seitlich wischen f&uuml;r die
    hinteren Bahnen und die Summen. Par antippen, um ihn zu korrigieren.</p>`;

  if (!round.completedAt){
    html += `<div class="navbar"><button class="btn-primary" data-act="finish">Runde beenden</button></div>`;
  } else {
    html += `<div class="navbar"><button data-act="summary">Zur Auswertung</button></div>`;
  }
  return html + `</div>`;
}

/* Spaltenfolge der Karte: die Bahnen, dazwischen Out, am Ende In und Gesamt.
   Laesst sich die Runde nicht halbieren, entfaellt Out/In und es bleibt die
   Gesamtsumme. */
function tableColumns(round){
  const n = holeCount(round);
  const half = halfPoint(n);
  const cols = [];
  for (let i = 0; i < n; i++){
    cols.push({ hole: i });
    if (half && i + 1 === half) cols.push({ sum: [0, half], label: "Out" });
  }
  if (half) cols.push({ sum: [half, n], label: "In" });
  cols.push({ sum: [0, n], label: "Ges" });
  return cols;
}

function parCell(round, i){
  return `<td class="par-editable" data-act="cycle-par-live" data-hole="${i}">${round.pars[i]}</td>`;
}

function strokeCell(v, par){
  if (v == null) return `<td class="empty-cell">&middot;</td>`;
  return `<td class="${scoreLabel(v, par).cls}"><strong>${v}</strong></td>`;
}

function sum(arr, from, to){
  let s = 0;
  for (let i = from; i < to; i++) s += arr[i];
  return s;
}

/* ---------- Statistik ---------- */

function fmtAvg(n, digits = 1){
  return Number.isFinite(n) ? n.toFixed(digits).replace(".", ",") : "&ndash;";
}

/* Wie fmtToPar, nur mit Nachkommastellen: genau auf Par bleibt "E". */
function fmtRelAvg(n){
  if (!Number.isFinite(n)) return "&ndash;";
  const s = fmtAvg(Math.abs(n), 2);
  if (Number(s.replace(",", ".")) === 0) return "E";
  return (n > 0 ? "+" : "\u2212") + s;
}

function viewStats(){
  const rows = statsFor(state.rounds);

  let html = `<div class="screen">` + topbar("Statistik", "\u00fcber alle abgeschlossenen Runden",
    `<button class="btn-ghost" data-act="home">Zur&uuml;ck</button>`);

  if (!rows.length){
    html += `<div class="card"><div class="empty">Noch nichts zu z&auml;hlen &ndash;
      schlie&szlig;e erst eine Runde ab.</div></div>`;
    return html + `</div>`;
  }

  for (const e of rows){
    const perHole = e.strokes / e.holes;
    const parPerHole = (e.strokes - e.par) / e.holes;

    html += `<div class="card">
      <div class="spread"><h2 class="stat-name" style="margin:0">${esc(e.name)}</h2>
        <span class="small muted">${e.rounds} Runde${e.rounds === 1 ? "" : "n"}</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${fmtAvg(perHole, 2)}</div>
          <div class="k">Schl&auml;ge je Bahn</div></div>
        <div class="stat"><div class="v">${fmtRelAvg(parPerHole)}</div>
          <div class="k">zu Par je Bahn</div></div>
        <div class="stat"><div class="v">${e.best ? e.best.strokes : "&ndash;"}</div>
          <div class="k">${e.best
            ? `beste Runde (${fmtToPar(e.best.toPar)})`
            : "keine volle Runde"}</div></div>
        <div class="stat"><div class="v">${e.holes}</div>
          <div class="k">Bahnen gez&auml;hlt</div></div>
      </div>`;

    if (e.best && e.best.course){
      html += `<p class="small muted" style="margin:0 0 8px">Beste Runde:
        ${esc(e.best.course)}, ${fmtDate(e.best.date)}</p>`;
    }

    const max = Math.max(1, ...COUNT_LABELS.map(([k]) => e.counts[k]));
    html += `<div class="bars">`;
    for (const [k, label] of COUNT_LABELS){
      const n = e.counts[k];
      if (!n) continue;
      const pct = Math.round((n / e.holes) * 100);
      html += `<div class="bar">
        <span class="${SCORE_CLASS[k]}">${label}</span>
        <span class="track"><span class="fill" style="width:${(n / max) * 100}%"></span></span>
        <span class="n">${n}</span>
      </div>`;
    }
    html += `</div>`;

    const pars = [3, 4, 5, 6].filter(x => e.byPar[x].holes > 0);
    if (pars.length){
      html += `<p class="small muted" style="margin:10px 0 0">Schnitt je Bahnart: ` +
        pars.map(x => `Par ${x} <strong>${fmtAvg(e.byPar[x].strokes / e.byPar[x].holes, 2)}</strong>`)
            .join(" &middot; ") + `</p>`;
    }
    html += `</div>`;
  }

  return html + `</div>`;
}

/* =========================================================================
   Interaktion
   ========================================================================= */

const ACTIONS = {
  new(){
    state.draft = makeRound("", todayISO(), [makePlayer(""), makePlayer("")],
      defaultPars(DEFAULT_HOLES), { stableford: false });
    state.view = "setup";
  },

  home(){
    state.view = "home";
    state.table = false;
    state.dataMsg = "";
  },

  stats(){ state.view = "stats"; },
  data(){ state.view = "data"; state.dataMsg = ""; },
  impressum(){ state.view = "impressum"; },

  open(el){
    const round = state.rounds.find(r => r.id === el.dataset.id);
    if (!round) return;
    state.activeId = round.id;
    state.table = false;
    state.hole = firstOpenHole(round);
    state.view = round.completedAt ? "summary" : "play";
    persist();
  },

  del(el){
    const round = state.rounds.find(r => r.id === el.dataset.id);
    if (!round) return;
    const name = round.courseName || "diese Runde";
    if (!isRoundEmpty(round) && !confirm(`"${name}" vom ${fmtDate(round.date)} löschen?`)) return;
    state.rounds = state.rounds.filter(r => r.id !== round.id);
    if (state.activeId === round.id) state.activeId = null;
    persist();
  },

  "add-player"(){
    if (state.draft.players.length >= MAX_PLAYERS) return;
    state.draft.players.push(makePlayer(""));
  },

  "rm-player"(el){
    if (state.draft.players.length <= 1) return;
    state.draft.players = state.draft.players.filter(p => p.id !== el.dataset.id);
  },

  "cycle-par"(el){
    const i = Number(el.dataset.hole);
    state.draft.pars[i] = state.draft.pars[i] >= MAX_PAR ? MIN_PAR : state.draft.pars[i] + 1;
  },

  "cycle-par-live"(el){
    const round = activeRound();
    if (!round) return;
    const i = Number(el.dataset.hole);
    round.pars[i] = round.pars[i] >= MAX_PAR ? MIN_PAR : round.pars[i] + 1;
    persist();
  },

  "reset-par"(){
    state.draft.pars = defaultPars(state.draft.pars.length);
  },

  "reset-si"(){
    state.draft.si = defaultSi(state.draft.pars.length);
  },

  holes(el){
    resizeDraft(state.draft, state.draft.pars.length + Number(el.dataset.delta));
  },

  "holes-set"(el){
    resizeDraft(state.draft, Number(el.dataset.n));
  },

  "toggle-stableford"(){
    state.draft.stableford = !state.draft.stableford;
  },

  "use-preset"(el){
    const pre = presetList(state.rounds)[Number(el.dataset.i)];
    if (!pre) return;
    state.draft.pars = pre.pars.slice();
    state.draft.si = pre.si.slice();
    // Ein gespielter Platz bringt seinen Namen mit, eine allgemeine Form nicht.
    if (pre.saved) state.draft.courseName = pre.name;
  },

  "use-player"(el){
    if (state.draft.players.length >= MAX_PLAYERS) return;
    const taken = new Set(state.draft.players.map(p => p.name.trim()).filter(Boolean));
    const person = recentPlayers(state.rounds).filter(p => !taken.has(p.name))[Number(el.dataset.i)];
    if (!person) return;
    // Eine noch leere Zeile fuellen, statt eine weitere danebenzusetzen.
    const empty = state.draft.players.find(p => !p.name.trim());
    if (empty){ empty.name = person.name; empty.hcp = person.hcp; }
    else state.draft.players.push(makePlayer(person.name, person.hcp));
  },

  start(){
    const d = state.draft;
    d.players.forEach((p, i) => { if (!p.name.trim()) p.name = "Spieler " + (i + 1); });
    const round = makeRound(d.courseName.trim(), d.date, d.players, d.pars,
      { si: d.si, stableford: d.stableford });
    state.rounds.push(round);
    state.activeId = round.id;
    state.draft = null;
    state.hole = 0;
    state.table = false;
    state.view = "play";
    persist();
  },

  stroke(el){
    const round = activeRound();
    if (!round) return;
    const id = el.dataset.id;
    const i = state.hole;
    round.strokes[id][i] = bumpStroke(round.strokes[id][i], round.pars[i], Number(el.dataset.delta));
    persist();
  },

  "clear-stroke"(el){
    const round = activeRound();
    if (!round) return;
    round.strokes[el.dataset.id][state.hole] = null;
    persist();
  },

  "prev-hole"(){ state.hole = Math.max(0, state.hole - 1); },
  "next-hole"(){
    const round = activeRound();
    state.hole = Math.min((round ? holeCount(round) : 1) - 1, state.hole + 1);
  },

  "toggle-table"(){
    const round = activeRound();
    if (state.table && round && round.completedAt){ state.view = "summary"; state.table = false; return; }
    state.table = !state.table;
  },

  "show-card"(){ state.table = true; state.view = "play"; },

  summary(){ state.table = false; state.view = "summary"; },

  finish(){
    const round = activeRound();
    if (!round) return;
    const open = holeCount(round) - roundProgress(round);
    if (open > 0 && !confirm(`${open} Bahn${open === 1 ? "" : "en"} ohne Eintrag. Runde trotzdem beenden?`)) return;
    round.completedAt = new Date().toISOString();
    state.table = false;
    state.view = "summary";
    persist();
  },

  reopen(){
    const round = activeRound();
    if (!round) return;
    round.completedAt = null;
    state.hole = firstOpenHole(round);
    state.view = "play";
    persist();
  },

  /* navigator.share braucht eine echte Nutzergeste. Der Klick-Handler ruft
     diese Funktion synchron auf, und share() ist das erste await -- damit
     bleibt die Geste gueltig. */
  async share(){
    const round = activeRound();
    if (!round) return;
    const text = shareText(round);
    try {
      if (navigator.share){
        await navigator.share({ title: round.courseName || "Swing Golf", text });
        return;
      }
      await navigator.clipboard.writeText(text);
      alert("Ergebnis in die Zwischenablage kopiert.");
    } catch (err){
      if (err && err.name === "AbortError") return;   // Nutzer hat abgebrochen
      alert(text);                                     // letzter Ausweg: zum Abschreiben
    }
  },

  "export-json"(){
    const blob = new Blob([serialize(state)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `swing-golf-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    state.dataMsg = `${state.rounds.length} Runde(n) als Datei gesichert.`;
  },

  "import-json"(){
    const input = document.getElementById("importFile");
    if (input) input.click();
  }
};

root.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || !root.contains(el)) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  fn(el);
  render();
});

/* Texteingaben aktualisieren das Modell ohne Neuzeichnen -- sonst verliert
   das Feld bei jedem Tastendruck den Fokus. */
root.addEventListener("input", ev => {
  const el = ev.target.closest("[data-field]");
  if (!el || !state.draft) return;
  const field = el.dataset.field;
  if (field === "player"){
    const p = state.draft.players.find(p => p.id === el.dataset.id);
    if (p) p.name = el.value;
  } else if (field === "hcp"){
    const p = state.draft.players.find(p => p.id === el.dataset.id);
    if (p) p.hcp = clamp(Math.round(Number(el.value) || 0), 0, MAX_HCP);
  } else if (field === "courseName" || field === "date"){
    state.draft[field] = el.value;
  }
});

/* Auswahlfelder und der Datei-Dialog laufen ueber change, nicht input. */
root.addEventListener("change", ev => {
  const si = ev.target.closest('[data-field="si"]');
  if (si && state.draft){
    state.draft.si[Number(si.dataset.hole)] = Number(si.value);
    render();                       // die Doppelt-Warnung muss mitziehen
    return;
  }

  const file = ev.target.id === "importFile" ? ev.target : null;
  if (!file || !file.files || !file.files[0]) return;

  const reader = new FileReader();
  reader.onerror = () => { state.dataMsg = "Die Datei konnte nicht gelesen werden."; render(); };
  reader.onload = () => {
    let data;
    try { data = JSON.parse(String(reader.result)); }
    catch { state.dataMsg = "Die Datei ist kein g\u00fcltiges JSON."; render(); return; }

    const incoming = Array.isArray(data) ? data
      : (data && Array.isArray(data.rounds) ? data.rounds : null);
    if (!incoming){ state.dataMsg = "In der Datei stehen keine Runden."; render(); return; }

    const merged = mergeRounds(state.rounds, incoming);
    state.rounds = merged.rounds;
    persist();
    state.dataMsg = `${merged.added} Runde(n) \u00fcbernommen, ${merged.skipped} `
      + `\u00fcbersprungen (schon vorhanden oder unbrauchbar).`;
    render();
  };
  reader.readAsText(file.files[0]);
});

/* =========================================================================
   Selbsttest: index.html?selftest=1
   ========================================================================= */

function runSelfTest(){
  const results = [];
  const check = (name, fn) => {
    try {
      const detail = fn();
      results.push({ name, ok: true, detail: detail || "" });
    } catch (err){
      results.push({ name, ok: false, detail: String(err && err.message || err) });
    }
  };
  const eq = (actual, expected, what) => {
    const a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`${what || ""} erwartet ${b}, war ${a}`);
  };

  const demo = () => {
    const r = makeRound("Testplatz", "2026-05-01",
      [{ id: "a", name: "Anna" }, { id: "b", name: "Ben" }], defaultPars(18));
    // Anna: Bahn 1 Birdie (3 auf Par 4), Bahn 2 Par, Bahn 3 Doppelbogey (5 auf Par 3)
    r.strokes.a[0] = 3; r.strokes.a[1] = 4; r.strokes.a[2] = 5;
    // Ben: Bahn 1 Bogey, Bahn 2 offen, Bahn 3 Par
    r.strokes.b[0] = 5; r.strokes.b[2] = 3;
    return r;
  };

  check("Par-Vorlage: 18 Bahnen, Summe 72", () => {
    eq(defaultPars(18).length, 18, "Anzahl Bahnen");
    eq(sum(defaultPars(18), 0, 18), 72, "Par gesamt");
    eq(sum(defaultPars(9), 0, 9), 36, "neun Bahnen ergeben 36");
    eq(defaultPars(20).slice(18), PAR_PATTERN.slice(0, 2), "wird zyklisch fortgesetzt");
    return "Out " + sum(defaultPars(18), 0, 9) + " / In " + sum(defaultPars(18), 9, 18);
  });

  check("makeRound legt 18 leere Bahnen je Spieler an", () => {
    const r = makeRound("X", "2026-01-01", [makePlayer("A")], defaultPars(18));
    const s = r.strokes[r.players[0].id];
    eq(s.length, 18, "Bahnen");
    eq(s.every(v => v === null), true, "alle leer");
  });

  check("totalStrokes ignoriert leere Bahnen", () => {
    eq(totalStrokes(demo(), "a"), 12, "Anna");
    eq(totalStrokes(demo(), "b"), 8, "Ben");
  });

  check("toPar rechnet nur gespielte Bahnen", () => {
    const r = demo();
    // Anna: 12 Schlaege auf Par 4+4+3 = 11  ->  +1
    eq(toPar(r, "a"), 1, "Anna");
    // Ben: 8 Schlaege auf Par 4+3 = 7  ->  +1
    eq(toPar(r, "b"), 1, "Ben");
    eq(holesPlayed(r, "b"), 2, "Bens gespielte Bahnen");
  });

  check("Out + In = Gesamt", () => {
    const r = demo();
    for (const p of r.players){
      const out = totalStrokes(r, p.id, 0, 9);
      const inn = totalStrokes(r, p.id, 9, 18);
      eq(out + inn, totalStrokes(r, p.id), p.name);
    }
  });

  check("scoreLabel bildet alle Faelle ab", () => {
    eq(scoreLabel(1, 4).key, "ace", "Hole-in-One");
    eq(scoreLabel(1, 3).key, "ace", "Ass auf Par 3");
    eq(scoreLabel(2, 5).key, "eagle", "Albatros");
    eq(scoreLabel(3, 5).key, "eagle", "Eagle");
    eq(scoreLabel(3, 4).key, "birdie", "Birdie");
    eq(scoreLabel(4, 4).key, "par", "Par");
    eq(scoreLabel(5, 4).key, "bogey", "Bogey");
    eq(scoreLabel(6, 4).key, "double", "Doppelbogey");
    eq(scoreLabel(9, 4).key, "double", "Triple+");
    eq(scoreLabel(null, 4).key, "none", "leer");
  });

  check("scoreCounts zaehlt je Kategorie", () => {
    eq(scoreCounts(demo(), "a"), { ace: 0, eagle: 0, birdie: 1, par: 1, bogey: 0, double: 1 });
    eq(scoreCounts(demo(), "b"), { ace: 0, eagle: 0, birdie: 0, par: 1, bogey: 1, double: 0 });
  });

  check("leaderboard sortiert nach ToPar, dann Schlaegen", () => {
    const r = demo();
    // Gleichstand bei +1 -> weniger Schlaege zuerst -> Ben (8) vor Anna (12)
    eq(leaderboard(r).map(e => e.name), ["Ben", "Anna"], "Reihenfolge bei Gleichstand");
    r.strokes.a[3] = 3;                       // Bahn 4 ist Par 5 -> Eagle, Anna auf -1
    eq(leaderboard(r)[0].name, "Anna", "Anna fuehrt nach Eagle");
    eq(leaderboard(r)[0].toPar, -1, "Annas Stand");
  });

  check("bumpStroke: erster Tipp landet auf Par, Grenzen halten", () => {
    eq(bumpStroke(null, 4, 1), 4, "leer + 1");
    eq(bumpStroke(null, 4, -1), 3, "leer - 1");
    eq(bumpStroke(4, 4, 1), 5, "hoch");
    eq(bumpStroke(1, 4, -1), 1, "Untergrenze");
    eq(bumpStroke(MAX_STROKES, 4, 1), MAX_STROKES, "Obergrenze");
    eq(bumpStroke(null, MIN_PAR, -1), MIN_STROKES + 1, "leer - 1 auf Par 3");
  });

  check("fmtToPar formatiert E / + / -", () => {
    eq(fmtToPar(0), "E"); eq(fmtToPar(3), "+3"); eq(fmtToPar(-2), "-2");
  });

  check("normalizeRound repariert kaputte Daten", () => {
    const pars = defaultPars(18);
    pars[1] = 99; pars[2] = "3"; pars[5] = null;            // Unsinn, String, Loch
    const r = normalizeRound({
      id: "r1", courseName: "Alt", date: "2026-02-02",
      pars,
      players: [{ id: "a", name: "Anna" }, { id: "x" }],     // Name fehlt
      strokes: { a: [4, 0, "5", -2, null, 1000] }           // zu kurz, 0, String, negativ
    });
    eq(r.pars.length, 18, "Par-Laenge");
    eq(r.pars[1], MAX_PAR, "99 auf Maximum geklemmt");
    eq(r.pars[2], 3, "String zu Zahl");
    eq(r.pars[5], defaultPars(18)[5], "fehlende Bahn aus Vorlage");
    eq(r.strokes.a.slice(0, 6), [4, null, 5, null, null, MAX_STROKES], "Schlaege bereinigt");
    eq(r.strokes.a.length, 18, "auf die Bahnenzahl aufgefuellt");
    eq(r.strokes.x.length, 18, "Spieler ohne Eintraege bekommt Array");
    eq(r.players[1].name, "", "fehlender Name wird leer");
  });

  check("normalizeRound verwirft Muell", () => {
    eq(normalizeRound(null), null, "null");
    eq(normalizeRound({ players: [] }), null, "ohne Spieler");
  });

  check("Runde ueberlebt Serialisieren und Zurueckladen", () => {
    const r = demo();
    r.pars[0] = 5;
    const back = deserialize(serialize({ rounds: [r], activeId: r.id }));
    eq(back.rounds.length, 1, "eine Runde");
    eq(back.activeId, r.id, "aktive Runde");
    eq(back.rounds[0], r, "identischer Inhalt");
  });

  check("deserialize haelt Schrott aus", () => {
    eq(deserialize(null).rounds, [], "leer");
    eq(deserialize("{kein json").rounds, [], "kaputtes JSON");
    eq(deserialize('{"rounds":"nein"}').rounds, [], "falscher Typ");
    eq(deserialize('{"rounds":[],"activeId":"weg"}').activeId, null, "verwaiste activeId");
  });

  check("localStorage-Runde ueberlebt Speichern und Laden", () => {
    const r = demo();
    const ok = saveState({ rounds: [r], activeId: r.id });
    if (!ok) return "uebersprungen: Browser erlaubt kein Schreiben";
    const back = loadState();
    eq(back.rounds[0].strokes.a[0], 3, "Annas Bahn 1");
    localStorage.removeItem(STORAGE_KEY);
    return "gespeichert und zurueckgelesen";
  });

  check("firstOpenHole findet die erste offene Bahn", () => {
    const r = demo();
    eq(firstOpenHole(r), 1, "Ben fehlt auf Bahn 2");
    r.strokes.b[1] = 4;
    eq(firstOpenHole(r), 3, "danach Bahn 4");
  });

  check("roundProgress zaehlt die weiteste Bahn", () => {
    eq(roundProgress(demo()), 3, "Anna hat 3");
    eq(isRoundEmpty(makeRound("X", "2026-01-01", [makePlayer("A")], defaultPars(18))), true, "leere Runde");
  });

  check("strokesReceived verteilt nach Stroke-Index", () => {
    const si = defaultSi(18);
    eq(defaultSi(18).map((_, i) => strokesReceived(0, si, i)).reduce((a, b) => a + b, 0), 0, "Vorgabe 0");
    eq(defaultSi(18).map((_, i) => strokesReceived(18, si, i)), new Array(18).fill(1), "Vorgabe 18");
    eq(strokesReceived(5, si, 0), 1, "SI 1 bei Vorgabe 5");
    eq(strokesReceived(5, si, 4), 1, "SI 5 bei Vorgabe 5");
    eq(strokesReceived(5, si, 5), 0, "SI 6 bei Vorgabe 5");
    eq(strokesReceived(20, si, 1), 2, "Vorgabe 20, SI 2");
    eq(strokesReceived(20, si, 2), 1, "Vorgabe 20, SI 3");
    eq(strokesReceived(999, si, 0), strokesReceived(MAX_HCP, si, 0), "ueber Maximum geklemmt");
  });

  check("stablefordPoints: Par netto = 2, nie negativ", () => {
    eq(stablefordPoints(4, 4, 0), 2, "Par");
    eq(stablefordPoints(3, 4, 0), 3, "Birdie");
    eq(stablefordPoints(2, 4, 0), 4, "Eagle");
    eq(stablefordPoints(5, 4, 0), 1, "Bogey");
    eq(stablefordPoints(6, 4, 0), 0, "Doppelbogey");
    eq(stablefordPoints(9, 4, 0), 0, "Triple+ bleibt 0");
    eq(stablefordPoints(5, 4, 1), 2, "Bogey mit einem Vorschlag = Par netto");
    eq(stablefordPoints(null, 4, 0), null, "leere Bahn");
  });

  check("Punkte der Runde zaehlen mit Vorgabe", () => {
    const r = makeRound("P", "2026-05-01",
      [{ id: "a", name: "Anna", hcp: 18 }, { id: "b", name: "Ben", hcp: 0 }],
      defaultPars(18), { stableford: true });
    for (let i = 0; i < 18; i++){ r.strokes.a[i] = r.pars[i] + 1; r.strokes.b[i] = r.pars[i]; }
    // Anna: jede Bahn ein Vorschlag, Bogey brutto -> Par netto -> 2 Punkte
    eq(totalPoints(r, "a"), 36, "Anna");
    eq(totalPoints(r, "b"), 36, "Ben");
    eq(holePoints(r, "a", 0), 2, "Annas Bahn 1");
    eq(leaderboard(r)[0].points, 36, "Spitze");
  });

  check("leaderboard sortiert bei Stableford nach Punkten", () => {
    const r = makeRound("P", "2026-05-01",
      [{ id: "a", name: "Anna" }, { id: "b", name: "Ben" }],
      defaultPars(18), { stableford: true });
    r.strokes.a[0] = 6;                 // 0 Punkte
    r.strokes.b[0] = 3;                 // Birdie, 3 Punkte
    eq(leaderboard(r).map(e => e.name), ["Ben", "Anna"], "nach Punkten");
    r.stableford = false;
    eq(leaderboard(r).map(e => e.name), ["Ben", "Anna"], "brutto gleiche Reihenfolge");
  });

  check("normalizeRound repariert Stroke-Index und Vorgabe", () => {
    const base = { id: "x", players: [{ id: "a", name: "A", hcp: 99 }], strokes: { a: [] } };
    eq(normalizeRound(Object.assign({}, base, { si: [1, 2, 3] })).si, defaultSi(18), "zu kurz");
    eq(normalizeRound(Object.assign({}, base, { si: new Array(18).fill(1) })).si, defaultSi(18), "alles gleich");
    const gut = defaultSi(18).slice().reverse();
    eq(normalizeRound(Object.assign({}, base, { si: gut })).si, gut, "gueltige Permutation bleibt");
    eq(normalizeRound(base).players[0].hcp, MAX_HCP, "Vorgabe geklemmt");
    eq(normalizeRound(base).stableford, false, "Stableford default aus");
  });

  check("statsFor buendelt ueber Runden nach Namen", () => {
    const mk = (date, strokes, fertig) => {
      const r = makeRound("Platz", date, [{ id: "a", name: "Anna" }], defaultPars(18));
      for (let i = 0; i < 18; i++) r.strokes.a[i] = strokes[i];
      if (fertig) r.completedAt = date + "T12:00:00Z";
      return r;
    };
    const parRunde = defaultPars(18).slice();
    const schlecht = defaultPars(18).map(v => v + 1);
    const s = statsFor([mk("2026-01-01", parRunde, true), mk("2026-02-01", schlecht, true),
                        mk("2026-03-01", schlecht, false)]);
    eq(s.length, 1, "ein Spieler");
    eq(s[0].rounds, 2, "offene Runde zaehlt nicht");
    eq(s[0].holes, 36, "Bahnen");
    eq(s[0].strokes, 72 + 90, "Schlaege");
    eq(s[0].best.strokes, 72, "beste Runde");
    eq(s[0].best.toPar, 0, "beste Runde zu Par");
    eq(s[0].counts.par, 18, "Pars");
    eq(s[0].counts.bogey, 18, "Bogeys");
    // 4 Par-3-Bahnen, zwei Runden: 4x Par (3) + 4x Bogey (4) = 28 Schlaege
    eq(s[0].byPar[3].holes, 8, "Par-3-Bahnen ueber beide Runden");
    eq(s[0].byPar[3].strokes, 28, "Schlaege auf Par 3");
  });

  check("statsFor ignoriert Spieler ohne Eintrag", () => {
    const r = makeRound("P", "2026-01-01", [makePlayer("A"), makePlayer("B")], defaultPars(18));
    r.strokes[r.players[0].id][0] = 4;
    r.completedAt = "2026-01-01T12:00:00Z";
    eq(statsFor([r]).map(e => e.name), ["A"], "nur wer gespielt hat");
  });

  check("Vorschlaege: zuletzt benutzte Spieler und Plaetze", () => {
    const alt = makeRound("Alter Platz", "2026-01-01", [makePlayer("Anna", 12)], defaultPars(18));
    const neu = makeRound("Neuer Platz", "2026-02-01",
      [makePlayer("Ben"), makePlayer("Anna", 10)], defaultPars(18).map(v => 3));
    eq(recentPlayers([alt, neu]).map(p => p.name), ["Ben", "Anna"], "neueste zuerst, ohne Dubletten");
    eq(recentPlayers([alt, neu])[1].hcp, 10, "juengste Vorgabe gewinnt");
    eq(recentCourses([alt, neu]).map(c => c.name), ["Neuer Platz", "Alter Platz"], "Plaetze");
    eq(recentCourses([alt, neu])[0].pars[0], 3, "Par-Vorlage kommt mit");
  });

  check("mergeRounds ergaenzt, ohne zu doppeln", () => {
    const a = demo(); const b = demo();
    const m1 = mergeRounds([a], [b]);
    eq(m1.added, 1, "fremde Runde kommt dazu");
    const m2 = mergeRounds([a], [a]);
    eq([m2.added, m2.skipped], [0, 1], "gleiche id wird uebersprungen");
    const m3 = mergeRounds([], [null, { players: [] }, a]);
    eq([m3.added, m3.skipped], [1, 2], "Muell faellt raus");
  });

  check("shareText nennt Platz, Rang und Ergebnis", () => {
    const r = demo();
    r.completedAt = "2026-05-01T12:00:00Z";
    const t = shareText(r);
    if (!t.includes("Testplatz")) throw new Error("Platz fehlt");
    if (!t.includes("1. Ben")) throw new Error("Rang fehlt: " + t);
    if (!t.includes("Par 72")) throw new Error("Par-Summe fehlt");
    r.stableford = true;
    if (!shareText(r).includes("Punkte")) throw new Error("Punkte fehlen bei Stableford");
  });

  check("Bahnenzahl kommt aus pars, nicht aus einer Konstanten", () => {
    const r9 = makeRound("Neun", "2026-01-01", [makePlayer("A")], defaultPars(9));
    eq(holeCount(r9), 9, "neun Bahnen");
    eq(r9.si, defaultSi(9), "Index passt sich an");
    eq(r9.strokes[r9.players[0].id].length, 9, "neun Eintraege");
    for (let i = 0; i < 9; i++) r9.strokes[r9.players[0].id][i] = r9.pars[i];
    eq(totalStrokes(r9, r9.players[0].id), 36, "Summe ueber neun Bahnen");
    eq(toPar(r9, r9.players[0].id), 0, "genau auf Par");
  });

  check("normalizeRound blaest kurze Runden nicht auf", () => {
    const r = normalizeRound({ id: "n", pars: defaultPars(9),
      players: [{ id: "a", name: "A" }], strokes: { a: [3] } });
    eq(r.pars.length, 9, "bleibt bei neun");
    eq(r.si.length, 9, "Index bleibt bei neun");
    eq(r.strokes.a.length, 9, "Schlaege bleiben bei neun");
    eq(normalizeRound({ id: "n", pars: new Array(99).fill(4),
      players: [{ id: "a", name: "A" }], strokes: {} }).pars.length, MAX_HOLES, "auf Maximum geklemmt");
    eq(normalizeRound({ id: "n", players: [{ id: "a", name: "A" }], strokes: {} }).pars.length,
      DEFAULT_HOLES, "ohne pars die Vorgabe");
  });

  check("halfPoint teilt nur, wo es Sinn ergibt", () => {
    eq(halfPoint(18), 9, "18 -> 9+9");
    eq(halfPoint(12), 6, "12 -> 6+6");
    eq(halfPoint(9), 0, "9 laesst sich nicht halbieren");
    eq(halfPoint(4), 0, "zu kurz zum Teilen");
    eq(halfPoint(6), 3, "6 -> 3+3");
  });

  check("tableColumns setzt die Summenspalten richtig", () => {
    const cols = n => tableColumns(makeRound("X", "2026-01-01", [makePlayer("A")], defaultPars(n)))
      .map(c => c.sum ? c.label : "#");
    eq(cols(18).filter(c => c !== "#"), ["Out", "In", "Ges"], "18 Bahnen");
    eq(cols(18).length, 18 + 3, "Spaltenzahl 18");
    eq(cols(12).filter(c => c !== "#"), ["Out", "In", "Ges"], "12 Bahnen");
    eq(cols(9).filter(c => c !== "#"), ["Ges"], "9 Bahnen nur Gesamt");
    eq(cols(9).length, 9 + 1, "Spaltenzahl 9");
    eq(cols(18).indexOf("Out"), 9, "Out steht nach Bahn 9");
  });

  check("commonPar nimmt das haeufigste Par", () => {
    eq(commonPar(defaultPars(18)), 4, "Standardrunde: zehnmal Par 4");
    eq(commonPar(new Array(12).fill(3)), 3, "Swingolf: Par 3");
    eq(commonPar([3, 3, 5, 5]), 3, "Gleichstand entscheidet das kleinere");
    eq(commonPar([]), PAR_PATTERN[0], "ohne Bahnen die Vorlage");
  });

  check("resizeSi ergibt immer eine Permutation", () => {
    eq(resizeSi(defaultSi(18), 9), defaultSi(9), "kuerzen");
    eq(resizeSi([3, 1, 2], 5).slice().sort((a, b) => a - b), [1, 2, 3, 4, 5], "erweitern");
    eq(resizeSi([3, 1, 2], 5).slice(0, 3), [3, 1, 2], "vorhandene bleiben an ihrer Bahn");
    eq(resizeSi([9, 9, 9], 3).slice().sort((a, b) => a - b), [1, 2, 3], "Dubletten werden ersetzt");
    eq(resizeSi(null, 4), defaultSi(4), "aus dem Nichts");
    eq(resizeSi([1, 2, 3], 2), [1, 2], "abgeschnittene Werte fallen weg");
  });

  check("resizeDraft zieht Par und Index mit", () => {
    const d = makeRound("X", "2026-01-01", [makePlayer("A")], defaultPars(18));
    d.pars[0] = 6;
    resizeDraft(d, 9);
    eq(d.pars.length, 9, "auf neun gekuerzt");
    eq(d.pars[0], 6, "eigenes Par bleibt");
    eq(d.si, defaultSi(9), "Index neu");
    resizeDraft(d, 12);
    eq(d.pars.length, 12, "wieder erweitert");
    eq(d.pars[0], 6, "eigenes Par ueberlebt beides");
    eq(d.pars[10], 4, "neue Bahn bekommt das haeufigste Par (10x 4 im Muster)");
    eq(new Set(d.si).size, 12, "Index bleibt eindeutig");
    resizeDraft(d, 999);
    eq(d.pars.length, MAX_HOLES, "Obergrenze");
    resizeDraft(d, 0);
    eq(d.pars.length, MIN_HOLES, "Untergrenze");
  });

  check("strokesReceived rechnet mit der tatsaechlichen Bahnenzahl", () => {
    const si9 = defaultSi(9);
    eq(si9.map((_, i) => strokesReceived(9, si9, i)), new Array(9).fill(1), "Vorgabe 9 auf 9 Bahnen");
    eq(strokesReceived(4, si9, 3), 1, "SI 4 bei Vorgabe 4");
    eq(strokesReceived(4, si9, 4), 0, "SI 5 bei Vorgabe 4");
    eq(strokesReceived(10, si9, 0), 2, "Vorgabe 10 auf 9 Bahnen");
  });

  check("presetList: gespielte Plaetze zuerst, dann die Vorlagen", () => {
    const gespielt = makeRound("Isartal", "2026-01-01", [makePlayer("A")], defaultPars(9));
    const list = presetList([gespielt]);
    eq(list[0].name, "Isartal", "gespielter Platz oben");
    eq([list[0].pars.length, list[0].saved], [9, true], "mit seiner Bahnenzahl");
    eq(list.slice(1).map(x => x.pars.length), [18, 9, 12, 9], "danach die mitgelieferten");
    eq(list.every(x => x.si.length === x.pars.length), true, "jede Vorlage hat einen passenden Index");
    eq(presetList([])[0].name, BUILTIN_PRESETS[0].name, "ohne Historie nur Vorlagen");
    eq(sum(BUILTIN_PRESETS[2].pars, 0, 12), 36, "Swingolf 12 x Par 3");
  });

  const failed = results.filter(r => !r.ok).length;
  root.innerHTML = `<div class="screen">
    ${topbar("Selbsttest", `${results.length - failed} von ${results.length} bestanden`)}
    <div class="card" style="padding:0; overflow:hidden">
      ${results.map(r => `<div class="test ${r.ok ? "pass" : "fail"}">
        <span class="mark">${r.ok ? "✓" : "✗"}</span>
        <span class="grow">${esc(r.name)}${r.detail ? `<code>${esc(r.detail)}</code>` : ""}</span>
      </div>`).join("")}
    </div>
    <p class="${failed ? "" : "muted"}" style="text-align:center; font-weight:700">
      ${failed ? failed + " FEHLGESCHLAGEN" : "Alles grün"}</p>
    <div class="stack"><a href="?" style="text-align:center">Zur App</a></div>
  </div>`;
  document.title = failed ? `Selbsttest: ${failed} fehlgeschlagen` : "Selbsttest: alles gruen";
  return failed;
}

/* =========================================================================
   Start
   ========================================================================= */

if (new URLSearchParams(location.search).has("selftest")){
  runSelfTest();
} else {
  const stored = loadState();
  state.rounds = stored.rounds;
  state.activeId = stored.activeId;
  const active = activeRound();
  /* Direkt zurueck in die laufende Runde: iOS entlaedt die Seite zwischen
     zwei Schlaegen regelmaessig, da will niemand jedes Mal neu navigieren. */
  if (active && !active.completedAt){
    state.hole = firstOpenHole(active);
    state.view = "play";
  }
  render();
}
